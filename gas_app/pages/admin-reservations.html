<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約管理 - きらきら放課後児童クラブ</title>
    <?!= include('pages/style'); ?>
    <style>
        /* Admin Calendar Styles */
        .calendar-grid {
            display: grid;
            grid-template-columns: 0.5fr repeat(6, 1fr);
            gap: 2px;
            background-color: var(--border-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .cal-head {
            background-color: var(--bg-secondary);
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-muted);
        }

        .cal-day {
            background-color: white;
            min-height: 80px;
            padding: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        .cal-day:hover {
            background-color: #f8fafc;
        }

        .cal-day.today {
            background-color: #f0f9ff;
            border: 1px solid #0ea5e9;
        }

        .cal-day.selected {
            background-color: #fff1f2;
            outline: 2px solid var(--primary);
            z-index: 10;
        }

        .cal-day.sunday {
            background-color: #fff5f5;
        }

        .cal-day.saturday {
            background-color: #f0f7ff;
        }

        .cal-day.other-month {
            opacity: 0.3;
            pointer-events: none;
        }

        .day-num {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .sunday .day-num {
            color: #ef4444;
        }

        .saturday .day-num {
            color: #3b82f6;
        }

        .cal-day-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .open-hours-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        .stat-line {
            font-size: 0.65rem;
            line-height: 1.2;
            margin-top: 2px;
        }

        .stat-confirmed {
            color: #16a34a;
        }

        .stat-pending {
            color: #2563eb;
        }

        .day-memo-tag {
            font-size: 0.6rem;
            background: #fef3c7;
            color: #92400e;
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 4px;
            word-break: break-all;
            line-height: 1.1;
        }
    </style>
</head>

<body>
    <?!= include('pages/navigation', {user: user, urlParams: urlParams}); ?>
    <?!= include('pages/utils'); ?>
    <div class="container mt-2">
        <h1 style="font-size:1.25rem; color:var(--primary-text);">📅 予約管理</h1>

        <!-- Month/Date Selector -->
        <div class="card mb-4">
            <div class="d-flex justify-between align-center mb-4">
                <div class="d-flex align-center gap-3">
                    <button class="btn-outline" onclick="changeMonth(-1)" style="padding:4px 12px;">◀ 前月</button>
                    <h2 id="current-month-label"
                        style="font-size:1.1rem; margin:0; min-width:120px; text-align:center;">----年--月</h2>
                    <button class="btn-outline" onclick="changeMonth(1)" style="padding:4px 12px;">次月 ▶</button>
                </div>
                <input type="date" id="date-picker" onchange="selectDate(this.value)"
                    style="max-width:150px; font-size:0.8rem;">
            </div>

            <div style="border-radius: 8px;">
                <div class="calendar-grid" id="admin-calendar">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>

        <!-- Selected Date Details -->
        <div class="card mb-4" id="date-details-card">
            <h2 class="h6 mb-3" style="color:var(--primary);"><span id="detail-date-label">日付を選択してください</span> の詳細</h2>
            <div class="d-flex gap-4 align-end"
                style="flex-wrap:wrap; border-bottom:1px solid var(--border-color); padding-bottom:1.5rem; margin-bottom:1.5rem;">
                <div style="flex:1; min-width:250px;">
                    <label class="font-bold d-block mb-1" style="font-size:0.8rem;">この日のスケジュール（行事・開所時間）</label>
                    <div class="d-flex gap-2">
                        <input type="text" id="day-memo" placeholder="例: 運動会代休" style="flex:2; font-size:0.875rem;">
                        <input type="text" id="day-open" placeholder="例: 閉所 / 8:00-12:00"
                            style="flex:1; font-size:0.875rem;">
                        <button class="btn-primary" onclick="saveDayContext()"
                            style="padding:4px 12px; font-size:0.8rem;">保存</button>
                    </div>
                </div>
            </div>

            <!-- Reservations Table -->
            <div class="card">
                <div class="d-flex justify-between align-center mb-4">
                    <h2 style="font-size:1rem; margin:0;">承認待ちの予約</h2>
                    <button class="btn-outline" onclick="bulkApprove()" style="font-size:0.8rem;">全て承認</button>
                </div>
                <div id="pending-container" class="mb-6">
                    <p class="text-muted">読み込み中...</p>
                </div>

                <div class="d-flex justify-between align-center mb-4"
                    style="border-top:1px solid var(--border-color); padding-top:1.5rem;">
                    <h2 style="font-size:1rem; margin:0;">指定日の予約一覧</h2>
                    <div class="d-flex align-center gap-2">
                        <label style="font-size:0.75rem; color:var(--text-muted);">並び替え:</label>
                        <select id="sort-order" onchange="renderTable(reservationsData)"
                            style="font-size:0.75rem; margin:0; padding:2px 4px; width:auto;">
                            <option value="default">デフォルト</option>
                            <option value="status">ステータス順</option>
                            <option value="name">名前順</option>
                        </select>
                    </div>
                </div>
                <div id="reservations-container">
                    <p class="text-muted">読み込み中...</p>
                </div>
            </div>
        </div>
        <div id="toast-container"></div>

        <!-- Edit Reservation Modal -->
        <div id="edit-modal" class="modal-overlay hidden">
            <div class="modal-card">
                <h3 style="margin-top:0; font-size:1rem;">✏️ 予約内容の編集</h3>
                <div id="edit-child-name" class="font-bold mb-3" style="font-size:0.9rem; color:var(--primary-text);">
                </div>

                <label class="font-bold d-block mb-1" style="font-size:0.8rem;">預かり時間</label>
                <input type="text" id="edit-time" placeholder="例: 15:00-18:30" class="mb-3">

                <label class="font-bold d-block mb-1" style="font-size:0.8rem;">帰宅方法</label>
                <select id="edit-return" class="mb-3">
                    <option value="お迎え">お迎え</option>
                    <option value="自力下校">自力下校</option>
                    <option value="習い事">習い事</option>
                    <option value="その他">その他</option>
                </select>

                <label class="d-flex align-center gap-2 mb-4" style="cursor:pointer; font-size:0.875rem;">
                    <input type="checkbox" id="edit-snack" style="width:auto; margin:0;">
                    <span>おやつを注文する 🍰</span>
                </label>

                <div class="d-flex gap-3">
                    <button id="save-edit-btn" onclick="saveReservationEdit()" class="btn-primary"
                        style="flex:1;">更新する</button>
                    <button onclick="closeEditModal()" class="btn-outline" style="flex:1;">キャンセル</button>
                </div>
            </div>
        </div>

        <script>
            let viewDate = new Date();
            let selectedDateStr = "<?= Utilities.formatDate(new Date(), 'Asia/Tokyo', 'yyyy-MM-dd') ?>";
            let monthlyStats = {};
            let reservationsData = [];
            let pendingData = [];
            let currentUser = JSON.parse('<?!= JSON.stringify(user) ?>');
            const baseUrl = '<?= baseUrl ?>';

            // showToast is now in utils.html

            function init() {
                if (!currentUser || !currentUser.email || (currentUser.role !== 'admin' && currentUser.role !== 'staff')) {
                    showToast('セッションが切れました', 'error');
                    setTimeout(() => { window.top.location.href = baseUrl + '?page=login'; }, 2000);
                    return;
                }
                document.getElementById('date-picker').value = selectedDateStr;
                renderAdminCalendar();
                loadDateContext();
                loadPending();
            }

            function changeMonth(delta) {
                viewDate.setMonth(viewDate.getMonth() + delta);
                renderAdminCalendar();
            }

            function selectDate(ds) {
                selectedDateStr = ds;
                document.getElementById('date-picker').value = ds;
                renderAdminCalendar(); // Update highlight
                loadDateContext();
            }

            function renderAdminCalendar() {
                const y = viewDate.getFullYear();
                const m = viewDate.getMonth();
                const monthStr = y + '-' + String(m + 1).padStart(2, '0');
                document.getElementById('current-month-label').innerText = y + '年' + (m + 1) + '月';

                // Load stats first
                google.script.run
                    .withSuccessHandler(function (stats) {
                        monthlyStats = stats || {};
                        const container = document.getElementById('admin-calendar');
                        container.innerHTML = ['日', '月', '火', '水', '木', '金', '土'].map(d => `<div class="cal-head">${d}</div>`).join('');

                        const firstDay = new Date(y, m, 1).getDay();
                        const lastDate = new Date(y, m + 1, 0).getDate();

                        // Pre-padding
                        for (let i = 0; i < firstDay; i++) container.innerHTML += '<div class="cal-day other-month"></div>';

                        for (let d = 1; d <= lastDate; d++) {
                            const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                            const info = monthlyStats[ds] || { confirmed: 0, pending: 0, memo: '' };
                            const dow = new Date(y, m, d).getDay();

                            let cls = 'cal-day';
                            if (dow === 0) cls += ' sunday';
                            if (dow === 6) cls += ' saturday';
                            if (ds === selectedDateStr) cls += ' selected';

                            container.innerHTML += `
                            <div class="${cls}" onclick="selectDate('${ds}')">
                                <div class="cal-day-header">
                                    <div class="day-num">${d}</div>
                                    <div class="open-hours-label">${info.openHours || ''}</div>
                                </div>
                                <div class="stat-line stat-confirmed">確: ${info.confirmed}</div>
                                <div class="stat-line stat-pending">申: ${info.pending}</div>
                                ${info.memo ? `<div class="day-memo-tag">${info.memo}</div>` : ''}
                            </div>
                        `;
                        }
                    })
                    .getMonthlyStatus(monthStr);
            }

            function loadReservations() {
                document.getElementById('reservations-container').innerHTML = '<p class="text-muted">読み込み中...</p>';
                google.script.run
                    .withSuccessHandler(renderTable)
                    .withFailureHandler(function (e) { showToast('取得エラー: ' + e.message, true); })
                    .getReservations(selectedDateStr);
            }

            function renderTable(data) {
                reservationsData = data || [];
                const c = document.getElementById('reservations-container');
                if (!reservationsData.length) { c.innerHTML = '<p class="text-muted text-center" style="padding:2rem;">この日の予約はありません</p>'; return; }

                // Sorting logic
                const sortVal = document.getElementById('sort-order').value;
                let displayData = [...reservationsData];
                if (sortVal === 'status') {
                    displayData.sort((a, b) => (a.statusCode || '').toString().localeCompare((b.statusCode || '').toString()));
                } else if (sortVal === 'name') {
                    displayData.sort((a, b) => (a.childName || '').localeCompare(b.childName || '', 'ja'));
                }

                const statusLabel = { '1': '承認済', '0': '承認済', '3': '申請中', '2': '申請中', '4': '却下', '5': '欠席申請中', '6': '欠席' };
                const statusCls = { '1': '#22c55e', '0': '#22c55e', '3': '#3b82f6', '2': '#3b82f6', '4': '#94a3b8', '5': '#f87171', '6': '#dc2626' };
                c.innerHTML = `<div style="overflow-x:auto;"><table>
                <thead><tr><th>児童</th><th>時間帯</th><th>帰宅方法</th><th>おやつ</th><th>ステータス</th><th>操作</th></tr></thead>
                <tbody>${displayData.map(r => `<tr>
                    <td>
                      <div class="font-bold">
                        <a href="#" onclick="window.top.location.href='${baseUrl}?page=parent&childId=${r.childId}'; return false;" style="color:var(--primary-text); text-decoration:underline;">${r.childName || r.childId}</a>
                      </div>
                    </td>
                    <td>${r.time || '-'}</td>
                    <td>${r.returnMethod || '-'}</td>
                    <td>${r.hasSnack ? '🍰' : '-'}</td>
                    <td><span style="background:${statusCls[r.statusCode] || '#94a3b8'}20; color:${statusCls[r.statusCode] || '#94a3b8'}; padding:2px 8px; border-radius:999px; font-size:0.75rem; font-weight:600;">${statusLabel[r.statusCode] || r.status}</span></td>
                    <td>
                        <div class="d-flex gap-2">
                        <button onclick="openEditModal('${r.id}')" style="border:none; background:#f1f5f9; color:var(--text-color); padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;">編集</button>
                        ${(r.statusCode == 2 || r.statusCode == 3) ? `
                            <button onclick="updateStatus('${r.id}','承認済')" style="border:none; background:#dcfce7; color:#166534; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;">承認</button>
                            <button onclick="updateStatus('${r.id}','却下')" style="border:none; background:#fee2e2; color:#991b1b; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;">却下</button>
                        ` : `
                            <button onclick="deleteReservation('${r.id}')" style="border:none; background:none; color:#dc2626; cursor:pointer; font-size:0.75rem; text-decoration:underline;">取消</button>
                        `}
                        </div>
                    </td>
                </tr>`).join('')}</tbody>
            </table></div>`;
            }

            let editingResId = null;
            function openEditModal(id) {
                const r = reservationsData.find(x => x.id === id);
                if (!r) return;
                editingResId = id;
                document.getElementById('edit-child-name').innerText = r.childName + ' さん';
                document.getElementById('edit-time').value = r.time || '';
                document.getElementById('edit-return').value = r.returnMethod || 'お迎え';
                document.getElementById('edit-snack').checked = !!r.hasSnack;
                document.getElementById('edit-modal').classList.remove('hidden');
            }

            function closeEditModal() {
                document.getElementById('edit-modal').classList.add('hidden');
            }

            function saveReservationEdit() {
                const time = document.getElementById('edit-time').value;
                const ret = document.getElementById('edit-return').value;
                const snack = document.getElementById('edit-snack').checked;
                const btn = document.getElementById('save-edit-btn');

                btn.disabled = true;
                btn.innerText = '更新中...';

                google.script.run
                    .withSuccessHandler(function (res) {
                        btn.disabled = false;
                        btn.innerText = '更新する';
                        if (res.success) {
                            showToast('予約内容を更新しました');
                            closeEditModal();
                            loadReservations();
                        } else {
                            showToast('エラー: ' + res.error, true);
                        }
                    })
                    .updateReservationDetails(editingResId, time, snack, ret);
            }

            function deleteReservation(id) {
                if (!confirm('この予約を完全に取り消しますか？')) return;
                google.script.run
                    .withSuccessHandler(function (r) {
                        showToast(r.success ? '取り消しました' : 'エラー: ' + r.error, !r.success);
                        if (r.success) { loadAll(); renderAdminCalendar(); }
                    })
                    .withFailureHandler(function (e) { showToast('エラー: ' + e.message, true); })
                    .cancelReservation(id);
            }

            function updateStatus(id, status) {
                google.script.run
                    .withSuccessHandler(function (r) {
                        showToast(r.success ? '更新しました' : 'エラー: ' + r.error, !r.success);
                        if (r.success) { loadAll(); renderAdminCalendar(); }
                    })
                    .withFailureHandler(function (e) { showToast('エラー: ' + e.message, true); })
                    .updateReservationStatus(id, status);
            }

            function bulkApprove() {
                const ids = pendingData.map(r => r.id);
                if (!ids.length) { showToast('承認待ちの予約はありません'); return; }
                if (!confirm(ids.length + '件を一括承認しますか？')) return;
                google.script.run
                    .withSuccessHandler(function (r) {
                        showToast(r.success ? '一括承認しました' : 'エラー', !r.success);
                        if (r.success) { loadAll(); renderAdminCalendar(); }
                    })
                    .withFailureHandler(function (e) { showToast('エラー: ' + e.message, true); })
                    .bulkUpdateReservations(ids, '承認済');
            }

            function loadDateContext() {
                document.getElementById('detail-date-label').innerText = selectedDateStr;
                loadReservations();
                google.script.run
                    .withSuccessHandler(function (info) {
                        document.getElementById('day-memo').value = info.memo || '';
                        document.getElementById('day-open').value = info.openHours || '';
                    })
                    .getDayInfo(selectedDateStr);
            }

            function saveDayContext() {
                const memo = document.getElementById('day-memo').value;
                const open = document.getElementById('day-open').value;
                google.script.run
                    .withSuccessHandler(function (r) {
                        showToast(r.success ? 'スケジュールを保存しました' : 'エラー', !r.success);
                        if (r.success) { loadDateContext(); renderAdminCalendar(); }
                    })
                    .saveDayInfo(selectedDateStr, memo, open);
            }

            function loadAll() {
                loadDateContext();
                loadPending();
            }

            function loadPending() {
                google.script.run
                    .withSuccessHandler(renderPending)
                    .withFailureHandler(function (e) {
                        showToast('承認待ちの取得に失敗しました', true);
                        document.getElementById('pending-container').innerHTML = '<p class="text-muted">読み取りエラー</p>';
                    })
                    .getPendingReservations();
            }

            function renderPending(data) {
                if (data && data.success === false) {
                    showToast('エラー: ' + data.error, true);
                    document.getElementById('pending-container').innerHTML = '<p class="text-muted">読み込みに失敗しました</p>';
                    return;
                }
                pendingData = data || [];
                const c = document.getElementById('pending-container');
                if (!pendingData.length) { c.innerHTML = '<p class="text-muted" style="font-size:0.9rem;">現在、承認待ちの予約はありません。 ✨</p>'; return; }
                c.innerHTML = `<div style="overflow-x:auto;"><table>
                <thead><tr><th>日付</th><th>児童</th><th>帰宅</th><th>おやつ</th><th>操作</th></tr></thead>
                <tbody>${pendingData.map(r => `<tr>
                    <td>${r.date}</td>
                    <td>
                      <div class="font-bold">
                        <a href="#" onclick="window.top.location.href='${baseUrl}?page=parent&childId=${r.childId}'; return false;" style="color:var(--primary-text); text-decoration:underline;">${r.childName}</a>
                        ${r.statusCode == 5 ? '<span style="color:#dc2626; font-size:0.7rem; margin-left:4px;">(欠席)</span>' : ''}
                      </div>
                    </td>
                    <td>${r.returnMethod || '-'}</td>
                    <td>${r.hasSnack ? '🍰' : '-'}</td>
                    <td>
                        <button onclick="updateStatus('${r.id}','承認済')" class="btn-primary" style="padding:4px 12px; font-size:0.75rem;">承認</button>
                    </td>
                </tr>`).join('')}</tbody>
            </table></div>`;
            }

            window.onload = init;
        </script>
</body>

</html>
