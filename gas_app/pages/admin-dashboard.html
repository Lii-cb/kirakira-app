<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ダッシュボード - きらきらマネージャー</title>
    <?!= include('pages/style'); ?>
</head>

<body>
    <!-- Full Screen Alert Overlay -->
    <div id="full-screen-alert" class="hidden">
        <h1 id="alert-child-name">○○ さん</h1>
        <h2 style="margin-bottom: 2rem;">お迎えです！</h2>
        <div class="d-flex gap-4" style="flex-wrap: wrap; justify-content: center;">
            <button class="btn-primary"
                style="background-color: white; color: #dc2626; font-size: 1.25rem; font-weight: bold; width: 150px; height: 150px; border-radius: 20px;"
                onclick="handleAlertAction('今呼びます')">
                今呼びます
            </button>
            <button class="btn-primary"
                style="background-color: white; color: #dc2626; font-size: 1.25rem; font-weight: bold; width: 150px; height: 150px; border-radius: 20px;"
                onclick="handleAlertAction('完了')">
                完了
            </button>
        </div>
        <button class="btn-outline" style="margin-top: 2rem; color: white; border-color: white;" onclick="closeAlert()">
            取り消し（アラート解除）
        </button>

        <!-- Action Log inside alert -->
        <div id="alert-action-log"
            style="margin-top: 2rem; width: 80%; max-width: 400px; text-align: left; background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px;">
            <!-- Log items injected here -->
        </div>
    </div>

    <div class="container">
        <div class="d-flex justify-between align-center mb-4">
            <div>
                <h1 style="color: var(--primary-text); font-size: 1.5rem; margin: 0;">ダッシュボード</h1>
                <p class="text-muted" id="current-date-display" style="margin: 0;"></p>
            </div>
            <div>
                <span class="badge"
                    style="background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color);"
                    id="user-name">読み込み中...</span>
            </div>
        </div>

        <!-- Quick Metrics -->
        <div class="d-flex gap-4 mb-4" style="flex-wrap: wrap;">
            <div class="card" style="flex: 1; min-width: 100px; padding: 1rem; text-align: center;">
                <div class="text-muted" style="font-size: 0.75rem;">予定</div>
                <div class="font-bold" style="font-size: 1.5rem; color: var(--text-color);" id="count-plan">0</div>
            </div>
            <div class="card" style="flex: 1; min-width: 100px; padding: 1rem; text-align: center;">
                <div class="text-muted" style="font-size: 0.75rem;">入室</div>
                <div class="font-bold" style="font-size: 1.5rem; color: #166534;" id="count-in">0</div>
            </div>
            <div class="card" style="flex: 1; min-width: 100px; padding: 1rem; text-align: center;">
                <div class="text-muted" style="font-size: 0.75rem;">退室</div>
                <div class="font-bold" style="font-size: 1.5rem; color: var(--text-muted);" id="count-out">0</div>
            </div>
            <div class="card" style="flex: 1; min-width: 100px; padding: 1rem; text-align: center;">
                <div class="text-muted" style="font-size: 0.75rem;">欠席</div>
                <div class="font-bold" style="font-size: 1.5rem; color: #991b1b;" id="count-absent">0</div>
            </div>
        </div>

        <!-- Attendance Table -->
        <div class="card">
            <div class="d-flex justify-between align-center mb-4">
                <h2 style="font-size: 1.125rem; margin: 0;">児童リスト</h2>
                <div class="d-flex align-center gap-2">
                    <span class="spinner hidden" id="sync-spinner"
                        style="width: 16px; height: 16px; border-width: 2px;"></span>
                    <span class="text-muted" id="last-sync-time" style="font-size: 0.75rem;">同期中...</span>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>帰</th>
                            <th>組</th>
                            <th>氏名</th>
                            <th>ステータス</th>
                            <th>入室</th>
                            <th>退室</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-tbody">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Daily Memos -->
        <div class="card mt-4">
            <h2 style="font-size: 1.125rem; margin: 0 0 1rem 0;">日報・連絡事項</h2>
            <div id="memos-container" class="mb-4"
                style="max-height: 300px; overflow-y: auto; background: var(--bg-color); padding: 1rem; border-radius: 8px;">
                <p class="text-muted" style="text-align:center;">読み込み中...</p>
            </div>

            <div style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
                <input type="text" id="memo-categories" placeholder="カテゴリ（カンマ区切り。例: 全体共有, 山田太郎）"
                    style="margin-bottom: 0.5rem;">
                <textarea id="memo-content" rows="2" placeholder="連絡内容を入力..."></textarea>
                <button class="btn-primary mt-2" onclick="submitMemo()" style="width: 100%;">送信</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        let currentDate = new Date();
        let currentUser = null;
        let attendanceData = [];
        let activeAlertChild = null; // null or child object

        const DATE_STR = [
            currentDate.getFullYear(),
            String(currentDate.getMonth() + 1).padStart(2, '0'),
            String(currentDate.getDate()).padStart(2, '0')
        ].join('-');

        document.getElementById('current-date-display').innerText =
            currentDate.getFullYear() + '年' + (currentDate.getMonth() + 1) + '月' + currentDate.getDate() + '日 (' + ['日', '月', '火', '水', '木', '金', '土'][currentDate.getDay()] + ')';

        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.innerText = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function init() {
            document.getElementById('sync-spinner').classList.remove('hidden');
            google.script.run
                .withSuccessHandler(function (user) {
                    currentUser = user;
                    document.getElementById('user-name').innerText = user.name;
                    loadData();
                    // Start polling every 15 seconds
                    setInterval(loadData, 15000);
                })
                .withFailureHandler(function (e) {
                    showToast('ユーザー情報の取得に失敗しました', true);
                })
                .getCurrentUser();
        }

        function loadData() {
            document.getElementById('sync-spinner').classList.remove('hidden');
            document.getElementById('last-sync-time').innerText = '同期中...';

            // Fetch Attendance
            google.script.run
                .withSuccessHandler(function (data) {
                    attendanceData = data;
                    renderTable();
                    updateMetrics();

                    const now = new Date();
                    document.getElementById('last-sync-time').innerText =
                        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0') + ' 更新';
                    document.getElementById('sync-spinner').classList.add('hidden');
                })
                .withFailureHandler(function (e) {
                    showToast('データ同期エラー', true);
                    document.getElementById('sync-spinner').classList.add('hidden');
                })
                .getAttendanceList(DATE_STR);

            // Fetch Memos
            google.script.run
                .withSuccessHandler(function (memos) {
                    renderMemos(memos);
                })
                .getDailyMemos(DATE_STR);
        }

        function renderMemos(memos) {
            const container = document.getElementById('memos-container');
            container.innerHTML = '';

            if (memos.length === 0) {
                container.innerHTML = '<p class="text-muted" style="text-align:center;">本日のメモはありません。</p>';
                return;
            }

            memos.forEach(m => {
                let catHtml = '';
                if (m.categories && m.categories.length > 0) {
                    catHtml = m.categories.map(c => `<span class="badge" style="background:#e2e8f0; color:#475569; margin-right:4px;">${c}</span>`).join('');
                }

                container.innerHTML += `
                    <div style="background: white; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 0.5rem;">
                        <div class="d-flex justify-between align-center mb-2" style="font-size: 0.75rem;">
                            <div>
                                <span class="font-bold">${m.author}</span>
                                <span class="text-muted ml-2">${m.time}</span>
                            </div>
                            <div>${catHtml}</div>
                        </div>
                        <div style="font-size: 0.875rem; white-space: pre-wrap;">${m.content}</div>
                    </div>
                `;
            });
            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function submitMemo() {
            const catInput = document.getElementById('memo-categories').value;
            const contentInput = document.getElementById('memo-content').value;

            if (!contentInput.trim()) {
                showToast('内容を入力してください', true);
                return;
            }

            const categories = catInput ? catInput.split(',').map(s => s.trim()) : [];

            document.getElementById('sync-spinner').classList.remove('hidden');

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        showToast('メモを追加しました！');
                        document.getElementById('memo-categories').value = '';
                        document.getElementById('memo-content').value = '';
                        loadData(); // Reload to fetch new memos
                    } else {
                        showToast('メモ送信エラー', true);
                    }
                })
                .withFailureHandler(function (e) {
                    showToast('通信エラー', true);
                    document.getElementById('sync-spinner').classList.add('hidden');
                })
                .addDailyMemo(DATE_STR, categories, contentInput);
        }

        function updateMetrics() {
            let counts = { '予定': 0, '入室': 0, '退室': 0, '欠席': 0 };
            attendanceData.forEach(d => {
                if (counts[d.status] !== undefined) counts[d.status]++;
            });
            document.getElementById('count-plan').innerText = counts['予定'];
            document.getElementById('count-in').innerText = counts['入室'];
            document.getElementById('count-out').innerText = counts['退室'];
            document.getElementById('count-absent').innerText = counts['欠席'];
        }

        function renderTable() {
            const tbody = document.getElementById('attendance-tbody');
            tbody.innerHTML = '';

            attendanceData.forEach(row => {
                const tr = document.createElement('tr');

                // Return icon
                let icon = '🚶';
                if (row.returnMethod.includes('お迎え')) icon = '🚗';
                if (row.returnMethod.includes('下校')) icon = '👥';
                if (row.returnMethod.includes('バス')) icon = '🚌';

                // Arrival Col
                let arrivalHtml = '';
                if (row.status === '予定') {
                    arrivalHtml = `<button class="btn-primary" onclick="changeStatus('${row.childId}', '入室')">入室</button>`;
                } else {
                    arrivalHtml = `<span class="text-muted">${row.arrivalTime || '--:--'}</span>`;
                }

                // Departure Col
                let depHtml = '';
                if (row.status === '入室') {
                    depHtml = `<button class="btn-outline" onclick="changeStatus('${row.childId}', '退室')">退室</button>`;
                } else if (row.status === '退室') {
                    depHtml = `<span class="text-muted">${row.departureTime || '--:--'}</span>`;
                }

                tr.innerHTML = `
            <td><div style="font-size: 1.25rem;">${icon}</div></td>
            <td>${row.grade || '-'}</td>
            <td>
              <div class="d-flex align-center justify-between" style="width:100%">
                <span class="font-bold">${row.name}</span>
                <button style="background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 0.25rem 0.5rem;" onclick="triggerAlert('${row.childId}')">
                  📢 アラート
                </button>
              </div>
            </td>
            <td><span class="badge status-${row.status}">${row.status}</span></td>
            <td>${arrivalHtml}</td>
            <td>${depHtml}</td>
          `;
                tbody.appendChild(tr);
            });
        }

        function changeStatus(childId, newStatus) {
            document.getElementById('sync-spinner').classList.remove('hidden');

            let updates = { status: newStatus };
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            if (newStatus === '入室') updates.arrivalTime = timeStr;
            if (newStatus === '退室') {
                updates.departureTime = timeStr;
                // If this child was the active alert, close it
                if (activeAlertChild && activeAlertChild.childId === childId) {
                    closeAlert();
                }
            }

            // Optimistic UI update
            const child = attendanceData.find(c => c.childId === childId);
            if (child) {
                child.status = newStatus;
                if (newStatus === '入室') child.arrivalTime = timeStr;
                if (newStatus === '退室') child.departureTime = timeStr;
                renderTable();
                updateMetrics();
            }

            google.script.run
                .withSuccessHandler(function () {
                    showToast(`${newStatus}に変更しました`);
                    // loadData(); // Let polling handle backend sync
                })
                .withFailureHandler(function (e) {
                    showToast('更新エラー', true);
                    loadData(); // Revert UX
                })
                .updateAttendance(childId, DATE_STR, updates);
        }

        // --- Alert System ---
        function triggerAlert(childId) {
            const child = attendanceData.find(c => c.childId === childId);
            if (!child) return;

            activeAlertChild = child;
            document.getElementById('alert-child-name').innerText = child.name + ' さん';
            document.getElementById('alert-action-log').innerHTML = ''; // clear logs
            document.getElementById('full-screen-alert').classList.remove('hidden');

            // Play sound theoretically (browser permits?)
            try {
                // const audio = new Audio('https://...');
                // audio.play();
            } catch (e) { }

            // Send GAS webhook (fire & forget)
            google.script.run
                .withFailureHandler(function () {
                    showToast('Webhook送信に失敗しました（画面表示は継続）', true);
                })
                .sendPickupAlert(child.name);
        }

        function closeAlert() {
            document.getElementById('full-screen-alert').classList.add('hidden');
            activeAlertChild = null;
        }

        function handleAlertAction(actionName) {
            const userName = currentUser ? currentUser.name : '職員';
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            const logBox = document.getElementById('alert-action-log');
            const entry = document.createElement('div');
            entry.style.marginBottom = '0.5rem';
            entry.innerHTML = `<span style="opacity: 0.7; margin-right: 0.5rem;">${timeStr}</span> <strong>${userName}</strong> が「${actionName}」を押しました`;

            logBox.appendChild(entry);

            // Optionally send this action to Google Chat in the future?
            // For now, it just stays on the screen as requested.
        }

        // Run
        window.onload = init;
    </script>
</body>

</html>
