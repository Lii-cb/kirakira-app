<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ダッシュボード - きらきら放課後児童クラブ</title>
    <?!= include('pages/style'); ?>
</head>

<body>
    <?!= include('pages/navigation', {user: user, urlParams: urlParams}); ?>
    <?!= include('pages/utils'); ?>


    <div class="container">
        <div class="d-flex justify-between align-center mb-4 mt-2">
            <div>
                <h1 style="color: var(--primary-text); font-size: 1.5rem; margin: 0;">ダッシュボード</h1>
                <p class="text-muted" id="current-date-display" style="margin: 0;"></p>
            </div>
            <div>
                <span class="badge"
                    style="background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color);"
                    id="user-name">読み込み中...</span>
            </div>
        </div>

        <!-- Quick Metrics -->
        <div class="d-flex gap-4 mb-4" style="flex-wrap: wrap;">
            <div class="card" style="flex: 1; min-width: 100px; padding: 1rem; text-align: center;">
                <div class="text-muted" style="font-size: 0.75rem;">在籍</div>
                <div class="font-bold" style="font-size: 1.5rem; color: #334155;" id="count-total">0</div>
            </div>
            <div class="card" style="flex: 1; min-width: 100px; padding: 1rem; text-align: center;">
                <div class="text-muted" style="font-size: 0.75rem;">予定</div>
                <div class="font-bold" style="font-size: 1.5rem; color: var(--text-color);" id="count-plan">0</div>
            </div>
            <div class="card" style="flex: 1; min-width: 100px; padding: 1rem; text-align: center;">
                <div class="text-muted" style="font-size: 0.75rem;">入室</div>
                <div class="font-bold" style="font-size: 1.5rem; color: #166534;" id="count-in">0</div>
            </div>
            <div class="card" style="flex: 1; min-width: 100px; padding: 1rem; text-align: center;">
                <div class="text-muted" style="font-size: 0.75rem;">退室</div>
                <div class="font-bold" style="font-size: 1.5rem; color: var(--text-muted);" id="count-out">0</div>
            </div>
            <div class="card" style="flex: 1; min-width: 100px; padding: 1rem; text-align: center;">
                <div class="text-muted" style="font-size: 0.75rem;">欠席</div>
                <div class="font-bold" style="font-size: 1.5rem; color: #991b1b;" id="count-absent">0</div>
            </div>
        </div>

        <div class="card mb-4">
            <h2 style="font-size:1rem; margin:0 0 1rem 0;">👥 職員出勤状況</h2>
            <div id="staff-attendance-container" style="overflow-x:auto;">
                <p class="text-muted">読み込み中...</p>
            </div>
        </div>

        <!-- Attendance Table -->
        <div class="card">
            <div class="d-flex justify-between align-center mb-4">
                <h2 style="font-size: 1.125rem; margin: 0;">児童リスト</h2>
                <div class="d-flex align-center gap-2">
                    <span class="spinner hidden" id="sync-spinner"
                        style="width: 16px; height: 16px; border-width: 2px;"></span>
                    <span class="text-muted" id="last-sync-time" style="font-size: 0.75rem;">同期中...</span>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>帰</th>
                            <th>組</th>
                            <th>氏名</th>
                            <th>ステータス</th>
                            <th>入室</th>
                            <th>退室</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-tbody">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Daily Memos -->
        <div class="card mt-4">
            <h2 style="font-size: 1.125rem; margin: 0 0 1rem 0;">日報・連絡事項</h2>
            <div id="memos-container" class="mb-4"
                style="max-height: 300px; overflow-y: auto; background: var(--bg-color); padding: 1rem; border-radius: 8px;">
                <p class="text-muted" style="text-align:center;">読み込み中...</p>
            </div>

            <div style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
                <div id="memo-cat-chips" class="d-flex gap-2 mb-2" style="flex-wrap:wrap;">
                    <? (systemSettings.memoCategories || ['一般', '連絡事項']).forEach(function(c) { ?>
                    <label
                        style="font-size:0.75rem; background:var(--bg-secondary); padding:4px 8px; border-radius:4px; cursor:pointer;">
                        <input type="checkbox" name="memo-cat" value="<?= c ?>">
                        <?= c ?>
                    </label>
                    <? }) ?>
                </div>
                <textarea id="memo-content" rows="2" placeholder="連絡内容を入力..."></textarea>
                <button class="btn-primary mt-2" onclick="submitMemo()" style="width: 100%;">送信</button>
            </div>
        </div>
        <div class="card mt-4" id="change-requests-card" class="hidden">
            <div class="d-flex justify-between align-center mb-4">
                <div class="d-flex align-center gap-2">
                    <input type="checkbox" id="check-all-requests" onclick="toggleAllRequests(this.checked)">
                    <h2 style="font-size: 1.125rem; margin: 0;">📋 保護者からの申請</h2>
                </div>
                <button id="approve-all-btn" class="btn-primary"
                    style="font-size: 0.75rem; padding: 4px 12px; background: #16a34a;"
                    onclick="approveSelectedRequests()">選択した項目を承認</button>
            </div>
            <div id="change-requests-container">
                <p class="text-muted" style="text-align:center;">読み込み中...</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>


    <script>
        let currentDate = new Date();
        let currentUser = JSON.parse('<?!= JSON.stringify(user) ?>');
        const baseUrl = '<?= baseUrl ?>';
        let attendanceData = [];
        let totalRegisteredCount = 0;
        let activeAlerts = new Set(); // Set of childIds

        const DATE_STR = [
            currentDate.getFullYear(),
            String(currentDate.getMonth() + 1).padStart(2, '0'),
            String(currentDate.getDate()).padStart(2, '0')
        ].join('-');

        document.getElementById('current-date-display').innerText =
            currentDate.getFullYear() + '年' + (currentDate.getMonth() + 1) + '月' + currentDate.getDate() + '日 (' + ['日', '月', '火', '水', '木', '金', '土'][currentDate.getDay()] + ')';

        // showToast and escapeHtml are now in utils.html

        function init() {
            if (!currentUser || !currentUser.email) {
                showToast('セッションが切れました', 'error');
                setTimeout(() => { window.top.location.href = baseUrl + '?page=login'; }, 2000);
                return;
            }
            document.getElementById('sync-spinner').classList.remove('hidden');
            document.getElementById('user-name').innerText = currentUser.name;
            loadData();
            // Start polling every 30 seconds (reduced frequency)
            setInterval(loadData, 30000);
        }

        function loadData() {
            document.getElementById('sync-spinner').classList.remove('hidden');
            document.getElementById('last-sync-time').innerText = '同期中...';

            // Fetch Attendance & Change Requests (combined)
            google.script.run
                .withSuccessHandler(function (result) {
                    attendanceData = result.records || [];
                    totalRegisteredCount = result.totalRegistered || 0;
                    renderTable();
                    updateMetrics();
                    renderChangeRequests(attendanceData);

                    const now = new Date();
                    document.getElementById('last-sync-time').innerText =
                        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0') + ' 更新';
                    document.getElementById('sync-spinner').classList.add('hidden');
                })
                .withFailureHandler(function (e) {
                    showToast('データ同期エラー', true);
                    document.getElementById('sync-spinner').classList.add('hidden');
                })
                .getAttendanceList(DATE_STR);

            // Fetch Memos
            google.script.run
                .withSuccessHandler(function (memos) { renderMemos(memos); })
                .withFailureHandler(function () { })
                .getDailyMemos(DATE_STR);

            // Fetch Staff Attendance
            google.script.run
                .withSuccessHandler(function (staff) { renderStaffAttendance(staff); })
                .withFailureHandler(function () { })
                .getStaffAttendance(DATE_STR);
        }

        function renderMemos(memos) {
            const container = document.getElementById('memos-container');
            container.innerHTML = '';

            if (memos.length === 0) {
                container.innerHTML = '<p class="text-muted" style="text-align:center;">本日のメモはありません。</p>';
                return;
            }

            memos.forEach(m => {
                let catHtml = '';
                if (m.categories && m.categories.length > 0) {
                    catHtml = m.categories.map(c => `<span class="badge" style="background:#e2e8f0; color:#475569; margin-right:4px;">${escapeHtml(c)}</span>`).join('');
                }

                container.innerHTML += `
                    <div style="background: white; padding: 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); margin-bottom: 0.5rem;">
                        <div class="d-flex justify-between align-center mb-2" style="font-size: 0.75rem;">
                            <div>
                                <span class="font-bold">${escapeHtml(m.author)}</span>
                                <span class="text-muted ml-2">${escapeHtml(m.time)}</span>
                            </div>
                            <div>${catHtml}</div>
                        </div>
                        <div style="font-size: 0.875rem; white-space: pre-wrap;">${escapeHtml(m.content)}</div>
                    </div>
                `;
            });
            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function renderStaffAttendance(staff) {
            const container = document.getElementById('staff-attendance-container');
            if (!staff || staff.length === 0) {
                container.innerHTML = '<p class="text-muted">職員データがありません。</p>';
                return;
            }

            container.innerHTML = `
                <table style="width:100%; border-collapse:collapse; font-size:0.875rem;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-color); text-align:left;">
                            <th style="padding:0.5rem;">名前</th>
                            <th style="padding:0.5rem;">状況</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${staff.map(s => {
                return `
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <td style="padding:0.5rem; font-weight:bold;">${escapeHtml(s.name)}</td>
                                <td style="padding:0.5rem;">
                                    <select onchange="updateStaffStatus('${s.email}', this.value)" style="padding:2px; font-size:0.75rem; border:1px solid var(--border-color); border-radius:4px;">
                                        <option value="未定" ${s.status === '未定' ? 'selected' : ''}>未定</option>
                                        <option value="予定" ${s.status === '予定' ? 'selected' : ''}>予定</option>
                                        <option value="在室" ${s.status === '在室' ? 'selected' : ''}>在室</option>
                                        <option value="一時退室" ${s.status === '一時退室' ? 'selected' : ''}>一時退室</option>
                                        <option value="退勤" ${s.status === '退勤' ? 'selected' : ''}>退勤</option>
                                        <option value="休み" ${s.status === '休み' ? 'selected' : ''}>休み</option>
                                    </select>
                                </td>
                            </tr>
                            `;
            }).join('')}
                    </tbody>
                </table>
            `;
        }

        function updateStaffStatus(email, status) {
            document.getElementById('sync-spinner').classList.remove('hidden');
            google.script.run
                .withSuccessHandler(function (r) {
                    showToast(r.success ? '職員ステータスを更新しました' : 'エラー: ' + r.error, !r.success);
                    loadData();
                })
                .withFailureHandler(function (e) {
                    showToast('サーバーエラー', true);
                    document.getElementById('sync-spinner').classList.add('hidden');
                })
                .updateStaffStatus(DATE_STR, email, { status: status });
        }

        let pendingRequests = [];
        function renderChangeRequests(data) {
            pendingRequests = (data || []).filter(r => r.changeRequestType && r.changeRequestStatus === 'pending');
            const pending = pendingRequests;
            const card = document.getElementById('change-requests-card');
            const c = document.getElementById('change-requests-container');
            if (!pending.length) {
                card.classList.add('hidden');
                return;
            }
            card.classList.remove('hidden');
            const typeLabel = { absence: '欠席', returnMethod: '帰宅方法変更' };
            c.innerHTML = pending.map((r, idx) => {
                const valParts = (r.changeRequestValue || '').split('|');
                const val = valParts[0];
                const memo = valParts[1] || '';
                return `<div style="display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0; border-bottom:1px solid var(--border-color);">
                    <div class="d-flex align-center gap-2">
                        <input type="checkbox" class="request-checkbox" data-index="${idx}">
                        <div>
                            <span class="font-bold">${r.name}</span>
                            <span class="badge" style="background:#fef3c7; color:#92400e; margin-left:6px;">${typeLabel[r.changeRequestType] || r.changeRequestType}: ${val}</span>
                            ${memo ? `<div class="text-muted" style="font-size:0.75rem;">メモ: ${memo}</div>` : ''}
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button onclick="approveRequest('${r.childId}','${r.date}',true)" style="border:none; background:#dcfce7; color:#166534; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;">承認</button>
                        <button onclick="approveRequest('${r.childId}','${r.date}',false)" style="border:none; background:#fee2e2; color:#991b1b; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;">却下</button>
                    </div>
                </div>`;
            }).join('');
        }

        function approveRequest(childId, dateStr, approved) {
            google.script.run
                .withSuccessHandler(function (r) {
                    showToast(r.success ? (approved ? '承認しました' : '却下しました') : 'エラー: ' + r.error, !r.success);
                    if (r.success) loadData();
                })
                .withFailureHandler(function (e) { showToast('エラー: ' + e.message, true); })
                .approveChangeRequest(childId, dateStr, approved);
        }

        function approveSelectedRequests() {
            const checkedBoxes = document.querySelectorAll('.request-checkbox:checked');
            if (checkedBoxes.length === 0) {
                showToast('承認する申請を選択してください', true);
                return;
            }

            if (!confirm(`選択された ${checkedBoxes.length} 件の申請を承認しますか？`)) return;

            const btn = document.getElementById('approve-all-btn');
            btn.disabled = true;
            btn.innerText = '処理中...';

            const requests = Array.from(checkedBoxes).map(cb => {
                const idx = parseInt(cb.getAttribute('data-index'));
                const r = pendingRequests[idx];
                return { childId: r.childId, date: r.date };
            });

            google.script.run
                .withSuccessHandler(function (r) {
                    btn.disabled = false;
                    btn.innerText = '選択した項目を承認';
                    showToast(r.success ? `${r.updatedCount} 件の申請を承認しました` : 'エラー: ' + r.error, !r.success);
                    if (r.success) loadData();
                })
                .withFailureHandler(function (e) {
                    btn.disabled = false;
                    btn.innerText = '選択した項目を承認';
                    showToast('エラー: ' + e.message, true);
                })
                .approveMultipleRequests(requests, true);
        }

        function toggleAllRequests(checked) {
            document.querySelectorAll('.request-checkbox').forEach(cb => {
                cb.checked = checked;
            });
        }

        function submitMemo() {

            const checkboxes = document.querySelectorAll('input[name="memo-cat"]:checked');
            const categories = Array.from(checkboxes).map(cb => cb.value);
            const contentInput = document.getElementById('memo-content').value;

            document.getElementById('sync-spinner').classList.remove('hidden');

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        showToast('メモを追加しました！');
                        document.querySelectorAll('input[name="memo-cat"]').forEach(cb => cb.checked = false);
                        document.getElementById('memo-content').value = '';
                        loadData(); // Reload to fetch new memos
                    } else {
                        showToast('メモ送信エラー', true);
                    }
                })
                .withFailureHandler(function (e) {
                    showToast('通信エラー', true);
                    document.getElementById('sync-spinner').classList.add('hidden');
                })
                .addDailyMemo(DATE_STR, categories, contentInput);
        }

        function updateMetrics() {
            let counts = { '予定': 0, '入室': 0, '退室': 0, '欠席': 0, '欠席申請中': 0 };
            attendanceData.forEach(d => {
                const s = d.status === '欠席申請中' ? '欠席申請中' : d.status;
                if (counts[s] !== undefined) counts[s]++;
            });
            document.getElementById('count-total').innerText = totalRegisteredCount;
            document.getElementById('count-plan').innerText = counts['予定'];
            document.getElementById('count-in').innerText = counts['入室'];
            document.getElementById('count-out').innerText = counts['退室'];
            document.getElementById('count-absent').innerText = counts['欠席'] + counts['欠席申請中'];
        }

        function renderTable() {
            const tbody = document.getElementById('attendance-tbody');
            tbody.innerHTML = '';

            attendanceData.forEach(row => {
                const tr = document.createElement('tr');

                // Return icon
                let icon = '🚶';
                if (row.returnMethod.includes('お迎え')) icon = '🚗';
                if (row.returnMethod.includes('下校')) icon = '👥';
                if (row.returnMethod.includes('バス')) icon = '🚌';

                // Arrival Col
                let arrivalHtml = '';
                if (row.status === '予定') {
                    arrivalHtml = `<button class="btn-primary" onclick="changeStatus('${row.childId}', '入室')">入室</button>`;
                } else {
                    arrivalHtml = `<select style="width:85px; padding:2px; font-size:0.85rem; border:1px solid var(--border-color); border-radius:4px;" onchange="manualTimeUpdate('${row.childId}', 'arrivalTime', this.value)">
                        ${generateTimeOptions(row.arrivalTime)}
                    </select>`;
                }

                // Departure Col
                let depHtml = '';
                if (row.status === '入室') {
                    depHtml = `<button class="btn-outline" onclick="changeStatus('${row.childId}', '退室')">退室</button>`;
                } else if (row.status === '退室') {
                    depHtml = `<select style="width:85px; padding:2px; font-size:0.85rem; border:1px solid var(--border-color); border-radius:4px;" onchange="manualTimeUpdate('${row.childId}', 'departureTime', this.value)">
                        ${generateTimeOptions(row.departureTime)}
                    </select>`;
                }

                const isAlerting = activeAlerts.has(row.childId);
                if (isAlerting) tr.classList.add('alert-pulse');

                let alertButtonHtml = '';
                if (isAlerting) {
                    alertButtonHtml = `
                        <div class="d-flex gap-1 align-center">
                            <span class="badge badge-pulse-red" style="font-size:0.7rem; padding:0.25rem 0.5rem;">呼出中</span>
                            <button style="background: #334155; color: white; border: none; padding: 0.25rem 0.5rem; font-size: 0.7rem; border-radius: 4px; cursor: pointer;" onclick="dismissAlert('${row.childId}')">完了</button>
                        </div>
                    `;
                } else {
                    alertButtonHtml = `
                        <button style="background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 0.25rem 0.5rem; font-size: 0.7rem; border-radius: 4px;" onclick="triggerAlert('${row.childId}')">
                          📢 お迎え呼び出し
                        </button>
                    `;
                }

                tr.innerHTML = `
            <td><div style="font-size: 1.25rem;">${icon}</div></td>
            <td>${row.grade || '-'}</td>
            <td>
              <div class="d-flex align-center justify-between" style="width:100%">
                <span class="font-bold">
                  <a href="#" onclick="window.top.location.href='${baseUrl}?page=parent&childId=${row.childId}'; return false;" style="color:var(--primary-text); text-decoration:underline;">${row.name}</a>
                </span>
                ${alertButtonHtml}
              </div>
            </td>
            <td>
              <div style="display:flex; flex-direction:column; align-items:center;">
                <select class="badge status-${row.status}" style="border:none; cursor:pointer;-webkit-appearance:none; appearance:none; display:block; margin:0 auto 2px;" onchange="changeStatus('${row.childId}', this.value)">
                  <option value="予定" ${row.status === '予定' ? 'selected' : ''}>予定</option>
                  <option value="入室" ${row.status === '入室' ? 'selected' : ''}>入室</option>
                  <option value="退室" ${row.status === '退室' ? 'selected' : ''}>退室</option>
                  <option value="欠席" ${row.status === '欠席' ? 'selected' : ''}>欠席</option>
                  <option value="欠席申請中" ${row.status === '欠席申請中' ? 'selected' : ''}>欠席申請中</option>
                </select>
                <div style="font-size:0.65rem; color:var(--text-muted); white-space:nowrap; text-align:center;">
                  <span style="opacity:0.8;">予定:</span> ${row.reservationTime || '未定'}
                </div>
              </div>
            </td>
            <td>${arrivalHtml}</td>
            <td>${depHtml}</td>
          `;
                tbody.appendChild(tr);
            });
        }

        function generateTimeOptions(currentValue) {
            let options = '<option value="">--:--</option>';
            for (let h = 7; h <= 21; h++) {
                for (let m = 0; m < 60; m += 10) {
                    const time = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
                    options += `<option value="${time}" ${time === currentValue ? 'selected' : ''}>${time}</option>`;
                }
            }
            return options;
        }

        function roundTimeString(timeStr, type) {
            if (!timeStr) return '';
            let [hours, minutes] = timeStr.split(':').map(Number);

            if (type === 'in' || type === 'arrivalTime') {
                // Round down (14:55 -> 14:50)
                minutes = Math.floor(minutes / 10) * 10;
            } else {
                // Round up (17:52 -> 18:00)
                minutes = Math.ceil(minutes / 10) * 10;
                if (minutes >= 60) {
                    minutes = 0;
                    hours += 1;
                }
            }
            return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0');
        }

        function getRoundedTime(type) {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            return roundTimeString(timeStr, type);
        }

        function manualTimeUpdate(childId, field, newValue) {
            if (!newValue) return;
            const roundedValue = roundTimeString(newValue, field);

            document.getElementById('sync-spinner').classList.remove('hidden');
            let updates = {};
            updates[field] = roundedValue;

            // Update local data
            const child = attendanceData.find(c => c.childId === childId);
            if (child) {
                child[field] = roundedValue;
                renderTable(); // Re-render to show rounded value in input
            }

            google.script.run
                .withSuccessHandler(function () {
                    showToast('時刻を更新しました');
                    document.getElementById('sync-spinner').classList.add('hidden');
                })
                .withFailureHandler(function (e) {
                    showToast('更新エラー', true);
                    loadData(); // Revert
                })
                .updateAttendance(childId, DATE_STR, updates);
        }

        function changeStatus(childId, newStatus) {
            document.getElementById('sync-spinner').classList.remove('hidden');

            let updates = { status: newStatus };
            let timeStr = '';

            if (newStatus === '入室') {
                timeStr = getRoundedTime('in');
                updates.arrivalTime = timeStr;
            } else if (newStatus === '退室') {
                timeStr = getRoundedTime('out');
                updates.departureTime = timeStr;
                // If this child was alerting, clear it on departure
                if (activeAlerts.has(childId)) {
                    dismissAlert(childId);
                }
            } else if (newStatus === '予定' || newStatus === '欠席') {
                // Clear times if manually set back
                updates.arrivalTime = '';
                updates.departureTime = '';
            }

            // Optimistic UI update
            const child = attendanceData.find(c => c.childId === childId);
            if (child) {
                child.status = newStatus;
                if (newStatus === '入室') child.arrivalTime = timeStr;
                if (newStatus === '退室') child.departureTime = timeStr;
                if (newStatus === '予定' || newStatus === '欠席') {
                    child.arrivalTime = '';
                    child.departureTime = '';
                }
                renderTable();
                updateMetrics();
            }

            google.script.run
                .withSuccessHandler(function () {
                    showToast(`${newStatus}に変更しました`);
                    // loadData(); // Let polling handle backend sync
                })
                .withFailureHandler(function (e) {
                    showToast('更新エラー', true);
                    loadData(); // Revert UX
                })
                .updateAttendance(childId, DATE_STR, updates);
        }

        // --- Alert System ---
        function triggerAlert(childId) {
            const child = attendanceData.find(c => c.childId === childId);
            if (!child) return;

            activeAlerts.add(childId);
            renderTable(); // Update UI to show pulse

            // Send GAS webhook (fire & forget)
            google.script.run
                .withFailureHandler(function () {
                    showToast('Webhook送信に失敗しました', true);
                })
                .sendPickupAlert(child.name);
        }

        function dismissAlert(childId) {
            activeAlerts.delete(childId);
            renderTable();
        }

        function handleAlertAction(childId, actionName) {
            const child = attendanceData.find(c => c.childId === childId);
            if (!child) return;

            showToast(`${child.name}さんを呼出中にしました`);
            // Optionally could add specific visual state for 'Calling' vs 'Waiting'
        }

        // Run
        window.onload = init;
    </script>
</body>

</html>
