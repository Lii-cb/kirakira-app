<!DOCTYPE html>
<html>

<head>
    <base target="_top">

    <style>
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-text);
            margin: 0 0 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Calendar */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .cal-header {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 0;
        }

        .cal-day {
            min-height: 52px;
            padding: 4px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
            position: relative;
            transition: all 0.15s;
        }

        .cal-day.other-month {
            opacity: 0.25;
            pointer-events: none;
            background: #f8fafc;
        }

        .cal-day.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f9fafb;
        }

        .cal-day.selected {
            border-color: var(--primary-text);
            background: #fdf2f8;
            box-shadow: 0 0 0 2px rgba(219, 39, 119, 0.2);
        }

        .cal-day.has-event {
            background: #fffbeb;
        }

        .cal-day.sunday .date-num {
            color: #dc2626;
        }

        .cal-day.saturday .date-num {
            color: #2563eb;
        }

        .ind {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-top: 2px;
        }

        .ind-pending {
            background: #3b82f6;
        }

        .ind-confirmed {
            background: #22c55e;
        }

        .ind-event {
            background: #f59e0b;
        }

        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.65rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-予定 {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-入室 {
            background: #dcfce7;
            color: #166534;
        }

        .status-退室 {
            background: #f1f5f9;
            color: #475569;
        }

        .status-欠席 {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }

        .modal-box {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow-lg);
        }

        .return-opt {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .return-opt:hover {
            background: #f1f5f9;
            border-color: var(--primary-text);
        }

        .return-opt input[type="radio"] {
            width: auto;
            margin: 0;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 0.5rem 0;
            padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
            z-index: 1000;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-decoration: none;
            flex: 1;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: var(--primary-text);
        }

        .nav-item i {
            font-size: 1.25rem;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            padding-bottom: 70px;
            /* Space for nav bar */
        }
    </style>
</head>

                    <button class="btn-outline" style="flex:1;" onclick="closeModal('return-modal')">キャンセル</button>
                    <button class="btn-primary" style="flex:1;" onclick="submitReturnChange()">送信</button>

        <div id="toast-container"></div>

        <script>
            const currentUser = JSON.parse('<?!= JSON.stringify(user) ?>');
            const urlParams = JSON.parse('<?!= JSON.stringify(urlParams) ?>');
            let childrenList = [];
            let activeChildId = null;
            let calDate = new Date();
            let selectedDates = new Set();
            let reservations = [];
            let systemSettings = {};
            const TODAY = new Date();
            const TODAY_STR = [TODAY.getFullYear(), String(TODAY.getMonth() + 1).padStart(2, '0'), String(TODAY.getDate()).padStart(2, '0')].join('-');

            // showToast and escapeHtml are now in utils.html
            function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
            function openModal(id) {
                document.getElementById(id).classList.remove('hidden');
                if (id === 'absence-modal') document.getElementById('abs-date-label').innerText = TODAY_STR;
                if (id === 'return-modal') {
                    document.getElementById('ret-date-label').innerText = TODAY_STR;
                    // Pre-select current method if possible
                    const current = document.getElementById('return-method').innerText.split('(')[0].trim();
                    const radios = document.getElementsByName('return-method');
                    for (let r of radios) {
                        if (r.value === current) r.checked = true;
                    }
                }
            }

            function switchTab(tabId) {
                // Hide all contents
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                // Remove active from nav items
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

                // Show current
                document.getElementById('tab-' + tabId).classList.add('active');
                // Set active to nav item
                const items = document.querySelectorAll('.nav-item');
                if (tabId === 'home') items[0].classList.add('active');
                else if (tabId === 'pay') items[1].classList.add('active');
                else if (tabId === 'docs') items[2].classList.add('active');

                // Optionally scroll to top
                window.scrollTo(0, 0);
            }

            // -------- INIT --------
            window.onload = function () {
                google.script.run
                    .withSuccessHandler(function (kids) {
                        childrenList = kids || [];
                        const sel = document.getElementById('child-selector');
                        sel.innerHTML = childrenList.map(c => `<option value="${c.id}">${c.name}（${c.grade}年）</option>`).join('');
                        if (childrenList.length > 0) {
                            // Priority: URL Param > First child
                            const paramChildId = urlParams.childId;
                            const exists = childrenList.some(c => c.id == paramChildId);

                            activeChildId = exists ? paramChildId : childrenList[0].id;
                            sel.value = activeChildId;
                            loadAll();
                        }
                    })
                    .withFailureHandler(function (e) { showToast('データ取得エラー: ' + e.message, true); })
                    .getLinkedChildren(currentUser.email);

                google.script.run
                    .withSuccessHandler(function (s) { systemSettings = s || {}; })
                    .getSettings();
            };

            function handleChildChange() {
                activeChildId = document.getElementById('child-selector').value;
                selectedDates.clear();
                loadAll();
            }

            function loadAll() {
                loadStatus();
                loadReservations();
                loadPayment();
            }

            // -------- BLOCK 1: ステータス --------
            function loadStatus() {
                document.getElementById('status-loading').classList.remove('hidden');
                document.getElementById('status-content').classList.add('hidden');
                document.getElementById('today-date-label').innerText = TODAY_STR;
                google.script.run
                    .withSuccessHandler(function (rec) {
                        document.getElementById('status-loading').classList.add('hidden');
                        document.getElementById('status-content').classList.remove('hidden');
                        const status = rec ? (rec.status || '未記録') : '未記録';
                        const cls = 'status-' + (status === '未記録' ? '予定' : status);
                        document.getElementById('today-status-badge').innerHTML = `<span class="status-badge ${cls}">${status}</span>`;
                        document.getElementById('arrival-time').innerText = rec && rec.arrivalTime ? rec.arrivalTime : '-';
                        document.getElementById('departure-time').innerText = rec && rec.departureTime ? rec.departureTime : '-';

                        let returnText = rec && rec.returnMethod ? rec.returnMethod : '-';
                        if (rec && rec.changeRequestType === 'returnMethod' && rec.changeRequestStatus === 'pending') {
                            const pendingVal = rec.changeRequestValue ? rec.changeRequestValue.split('|')[0] : '';
                            returnText += ` <span style="font-size:0.7rem; color:#b45309; background:#fff7ed; padding:1px 4px; border-radius:4px;">(承認待ち: ${pendingVal})</span>`;
                        }
                        document.getElementById('return-method').innerHTML = returnText;
                    })
                    .withFailureHandler(function () {
                        document.getElementById('status-loading').classList.add('hidden');
                        document.getElementById('status-content').classList.remove('hidden');
                    })
                    .getAttendanceForChild(activeChildId, TODAY_STR);
            }

            function submitAbsence() {
                const memo = document.getElementById('abs-memo').value;
                closeModal('absence-modal');
                google.script.run
                    .withSuccessHandler(function (r) {
                        showToast(r.success ? '欠席連絡を送信しました' : 'エラー: ' + r.error, !r.success);
                        if (r.success) loadStatus();
                    })
                    .withFailureHandler(function (e) { showToast('送信エラー: ' + e.message, true); })
                    .submitChangeRequest(activeChildId, TODAY_STR, 'absence', '欠席', memo);
            }

            function submitReturnChange() {
                const m = document.querySelector('input[name="return-method"]:checked');
                if (!m) { showToast('帰宅方法を選択してください', true); return; }
                const memo = document.getElementById('ret-memo').value;
                closeModal('return-modal');
                google.script.run
                    .withSuccessHandler(function (r) {
                        showToast(r.success ? '帰宅方法変更を送信しました' : 'エラー: ' + r.error, !r.success);
                        if (r.success) loadStatus();
                    })
                    .withFailureHandler(function (e) { showToast('送信エラー: ' + e.message, true); })
                    .submitChangeRequest(activeChildId, TODAY_STR, 'returnMethod', m.value, memo);
            }

            // -------- BLOCK 2: カレンダー --------
            function loadReservations() {
                google.script.run
                    .withSuccessHandler(function (res) {
                        reservations = res || [];
                        renderCalendar();
                        renderReservationHistory();
                    })
                    .withFailureHandler(function () { renderCalendar(); })
                    .getReservationsForChild(activeChildId);

                // Also load documents
                google.script.run
                    .withSuccessHandler(renderDocs)
                    .withFailureHandler(function () { })
                    .getDocuments();
            }

            function changeMonth(delta) {
                calDate.setMonth(calDate.getMonth() + delta);
                selectedDates.clear();
                updateReservationForm();
                renderCalendar();
            }

            function renderCalendar() {
                const y = calDate.getFullYear(), m = calDate.getMonth();
                document.getElementById('cal-month-label').innerText = y + '年' + (m + 1) + '月';
                const cal = document.getElementById('calendar');
                cal.innerHTML = ['日', '月', '火', '水', '木', '金', '土'].map(d => `<div class="cal-header">${d}</div>`).join('');

                const reservedMap = {};
                reservations.forEach(r => { reservedMap[r.date] = r.statusCode; });

                const first = new Date(y, m, 1).getDay();
                const days = new Date(y, m + 1, 0).getDate();

                for (let i = 0; i < first; i++) cal.innerHTML += '<div class="cal-day other-month"></div>';
                for (let d = 1; d <= days; d++) {
                    const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                    const dow = new Date(y, m, d).getDay();
                    const isPast = ds < TODAY_STR;
                    const statusCode = reservedMap[ds];
                    let cls = 'cal-day';
                    if (dow === 0) cls += ' sunday';
                    if (dow === 6) cls += ' saturday';
                    if (dow === 0 || isPast) cls += ' disabled';
                    if (selectedDates.has(ds)) cls += ' selected';

                    let ind = '';
                    if (statusCode == 2 || statusCode == 3) ind = '<div class="ind ind-pending"></div>';
                    else if (statusCode == 1 || statusCode == 0) ind = '<div class="ind ind-confirmed"></div>';

                    const clickable = canEdit(ds) && dow !== 0 && (statusCode === undefined || statusCode === null || statusCode == 2 || statusCode == 3 || statusCode == 1 || statusCode == 0);
                    cal.innerHTML += `<div class="${cls}" ${clickable ? `onclick="toggleDate('${ds}')"` : ''}>
                    <span class="date-num">${d}</span>${ind}
                </div>`;
                }
            }

            function canEdit(dateStr) {
                if (currentUser.role === 'admin' || currentUser.role === 'staff') return true;
                const target = new Date(dateStr.replace(/-/g, '/'));
                const today = new Date(TODAY_STR.replace(/-/g, '/'));
                return target >= today; // 今日以降なら編集可能（過去は不可）
            }

            function toggleDate(ds) {
                if (selectedDates.has(ds)) selectedDates.delete(ds);
                else selectedDates.add(ds);
                renderCalendar();
                updateReservationForm();
            }

            function updateReservationForm() {
                const form = document.getElementById('reservation-form');
                if (selectedDates.size === 0) { form.classList.add('hidden'); return; }
                form.classList.remove('hidden');
                const sorted = Array.from(selectedDates).sort();
                const count = sorted.length;
                document.getElementById('selected-dates-label').innerText = sorted.join('、') + '（' + count + '日）';

                // その日の個別情報を取得 (一番最初の選択日を基準にする)
                const timeSel = document.getElementById('res-time');
                const memoEl = document.getElementById('res-memo-display') || (function () {
                    const el = document.createElement('div');
                    el.id = 'res-memo-display';
                    el.style = 'background:var(--bg-secondary); padding:8px; border-radius:8px; margin-bottom:1rem; font-size:0.875rem; color:var(--primary-text); border-left:4px solid var(--primary);';
                    form.insertBefore(el, form.firstChild);
                    return el;
                })();

                // Check for existing reservation data if exactly one day is selected
                let existingRes = null;
                if (count === 1) {
                    existingRes = reservations.find(r => r.date === sorted[0]);
                }

                google.script.run
                    .withSuccessHandler(function (info) {
                        if (info.memo) {
                            memoEl.innerText = '📌 連絡事項: ' + info.memo;
                            memoEl.style.display = 'block';
                        } else {
                            memoEl.style.display = 'none';
                        }

                        const hasSaturday = sorted.some(d => new Date(d.replace(/-/g, '/')).getDay() === 6);
                        let timeStr = info.openHours;

                        if (!timeStr) {
                            // 個別設定がない場合はデフォルト
                            timeStr = hasSaturday ? (systemSettings.openSaturday || '7:30-12:00') : (systemSettings.openWeekday || '15:00-18:30');
                        }

                        if (timeStr && timeStr.indexOf('閉') !== -1) {
                            timeSel.innerHTML = `<option value="">❌ この日は予約できません（${timeStr}）</option>`;
                            timeSel.disabled = true;
                            document.querySelector('#reservation-form button.btn-primary').disabled = true;
                        } else {
                            let optionsHtml = '';
                            if (count > 1) {
                                optionsHtml += `<option value="AUTO_OPEN_HOURS">✨ 各日程の開所時間にあわせる</option>`;
                            }
                            optionsHtml += `<option value="${timeStr}">${timeStr}</option>`;
                            timeSel.innerHTML = optionsHtml;
                            timeSel.disabled = false;
                            document.querySelector('#reservation-form button.btn-primary').disabled = false;

                            // Pre-fill existing data
                            if (existingRes) {
                                timeSel.value = existingRes.time || timeStr;
                                document.getElementById('res-snack').checked = !!existingRes.hasSnack;
                                if (existingRes.returnMethod) {
                                    const rads = document.getElementsByName('res-return-method');
                                    for (let r of rads) {
                                        if (r.value === existingRes.returnMethod) r.checked = true;
                                    }
                                }
                                document.querySelector('#reservation-form button.btn-primary').innerText = '予約内容を更新する';
                            } else {
                                document.querySelector('#reservation-form button.btn-primary').innerText = '予約を申し込む';
                            }
                        }
                    })
                    .getDayInfo(sorted[0]);

                updateResFee();
            }

            function updateResFee() {
                const hasSnack = document.getElementById('res-snack').checked;
                const n = selectedDates.size;
                document.getElementById('res-fee').innerText = hasSnack ? `おやつ料（見積）: ¥${100 * n}（¥100 × ${n}日）` : '';
            }

            function submitReservation() {
                if (selectedDates.size === 0) { showToast('日付を選択してください', true); return; }
                const dates = Array.from(selectedDates).sort();
                const time = document.getElementById('res-time').value;
                const retMethodEl = document.querySelector('input[name="res-return-method"]:checked');
                const retMethod = retMethodEl ? retMethodEl.value : '';
                const hasSnack = document.getElementById('res-snack').checked;

                // 既存予約（1件のみ）の更新
                if (dates.length === 1 && reservations.some(r => r.date === dates[0])) {
                    const id = activeChildId + '_' + dates[0];
                    google.script.run
                        .withSuccessHandler(function (r) {
                            showToast(r.success ? '予約内容を更新しました' : 'エラー: ' + r.error, !r.success);
                            if (r.success) { selectedDates.clear(); updateReservationForm(); loadReservations(); }
                        })
                        .updateReservationDetails(id, time, hasSnack, retMethod);
                    return;
                }

                google.script.run
                    .withSuccessHandler(function (r) {
                        showToast(r.success ? `${dates.length}日分の予約を送信しました` : 'エラー: ' + r.error, !r.success);
                        if (r.success) { selectedDates.clear(); updateReservationForm(); loadReservations(); }
                    })
                    .withFailureHandler(function (e) { showToast('送信エラー: ' + e.message, true); })
                    .submitReservation(activeChildId, dates, time, hasSnack, retMethod);
            }

            function renderReservationHistory() {
                const c = document.getElementById('reservation-history');
                if (!reservations.length) { c.innerHTML = '<p class="text-muted" style="font-size:0.8rem;">予約はありません</p>'; return; }
                const statusColor = { '1': '#16a34a', '0': '#16a34a', '3': '#2563eb', '2': '#2563eb', '4': '#94a3b8', '5': '#f87171', '6': '#dc2626' };
                c.innerHTML = reservations.slice(0, 15).map(r => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:0.4rem 0; border-bottom:1px solid var(--border-color);">
                    <div>
                        <span class="font-bold" style="font-size:0.875rem;">${r.date}</span>
                        <span class="text-muted" style="font-size:0.75rem; margin-left:6px;">${r.time || ''} ${r.hasSnack ? '🍰' : ''}</span>
                    </div>
                    <div class="d-flex align-center gap-2">
                        <span style="font-size:0.75rem; font-weight:600; color:${statusColor[r.statusCode] || '#6b7280'};">${r.status}</span>
                        ${canEdit(r.date) ? `
                            <button onclick="editRes('${r.date}')" style="border:none; background:none; color:var(--secondary-text); cursor:pointer; font-size:0.7rem; padding:0;">編集</button>
                            <button onclick="cancelRes('${r.id}')" style="border:none; background:none; color:#b91c1c; cursor:pointer; font-size:0.7rem; padding:0;">取消</button>
                        ` : ((currentUser.role === 'admin' || currentUser.role === 'staff') ? `<button onclick="cancelRes('${r.id}')" style="border:none; background:none; color:#b91c1c; cursor:pointer; font-size:0.7rem; padding:0;">取消</button>` : '')}
                    </div>
                </div>`).join('');
            }

            function editRes(dateStr) {
                selectedDates.clear();
                selectedDates.add(dateStr);
                // Ensure the calendar is showing the month of the reservation
                const resDate = new Date(dateStr.replace(/-/g, '/'));
                if (calDate.getMonth() !== resDate.getMonth() || calDate.getFullYear() !== resDate.getFullYear()) {
                    calDate = new Date(resDate.getFullYear(), resDate.getMonth(), 1);
                }
                renderCalendar();
                updateReservationForm();
                document.getElementById('reservation-form').scrollIntoView({ behavior: 'smooth' });
            }

            function cancelRes(id) {
                if (!confirm('この予約を取り消しますか？')) return;
                google.script.run
                    .withSuccessHandler(function (r) {
                        showToast(r.success ? '取り消しました' : 'エラー: ' + r.error, !r.success);
                        if (r.success) loadReservations();
                    })
                    .withFailureHandler(function (e) { showToast('エラー: ' + e.message, true); })
                    .cancelReservation(id);
            }

            function renderDocs(docs) {
                const c = document.getElementById('docs-list');
                if (!docs || !docs.length) { c.innerHTML = '<p class="text-muted" style="font-size:0.8rem;">おたよりはありません</p>'; return; }
                const catLabel = { news: 'お知らせ', event: 'イベント', other: 'その他' };
                const catColor = { news: '#0369a1', event: '#b45309', other: '#6b7280' };
                c.innerHTML = docs.slice(0, 10).map(d => `
                <div style="padding:0.4rem 0; border-bottom:1px solid var(--border-color);">
                    <span style="font-size:0.7rem; font-weight:600; color:${catColor[d.category] || '#6b7280'}; background:#f1f5f9; padding:1px 6px; border-radius:4px; margin-right:6px;">${catLabel[d.category] || d.category}</span>
                    <span style="font-size:0.875rem; font-weight:500;">${d.title}</span>
                    ${d.url ? `<br><a href="${d.url}" target="_top" style="font-size:0.75rem; color:var(--primary-text);">🔗 開く</a>` : ''}
                </div>`).join('');
            }

            // -------- BLOCK 3: 利用料 --------
            function loadPayment() {
                google.script.run
                    .withSuccessHandler(function (b) {
                        document.getElementById('pay-balance').innerText = '¥' + ((b && b.balance) ? b.balance : 0).toLocaleString();
                        document.getElementById('pay-total').innerText = '¥' + ((b && b.total) ? b.total : 0).toLocaleString();
                    })
                    .withFailureHandler(function () { })
                    .getChildBalance(activeChildId);
                google.script.run
                    .withSuccessHandler(function (payments) {
                        const c = document.getElementById('payment-history');
                        if (!payments || !payments.length) { c.innerHTML = '<p class="text-muted" style="font-size:0.8rem;">履歴はありません</p>'; return; }
                        c.innerHTML = payments.map(p => `
                        <div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid var(--border-color);">
                            <div>
                                <span class="font-bold" style="font-size:0.875rem;">¥${(p.amount || 0).toLocaleString()}</span>
                                <span class="text-muted" style="font-size:0.75rem; margin-left:6px;">${p.reportedAt || ''}</span>
                            </div>
                            <span style="font-size:0.75rem; font-weight:600; color:${p.status === 'confirmed' ? '#16a34a' : '#92400e'};">${p.status === 'confirmed' ? '確認済' : '未確認'}</span>
                        </div>`).join('');
                    })
                    .withFailureHandler(function () { })
                    .getPaymentsForChild(activeChildId);
            }

            function submitPayment() {
                const amount = parseInt(document.getElementById('pay-amount').value);
                if (!amount || amount <= 0) { showToast('金額を正しく入力してください', true); return; }
                google.script.run
                    .withSuccessHandler(function (r) {
                        showToast(r.success ? '入金報告を送信しました' : 'エラー: ' + r.error, !r.success);
                        if (r.success) { document.getElementById('pay-amount').value = ''; loadPayment(); }
                    })
                    .withFailureHandler(function (e) { showToast('エラー: ' + e.message, true); })
                    .submitPaymentReport(activeChildId, amount);
            }
        </script>
</body>

</html>
