<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>保護者ページ - きらきらマネージャー</title>
    <?!= include('pages/style'); ?>
    <style>
        /* Custom Calendar Styles */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 1rem;
        }

        .cal-header {
            text-align: center;
            font-weight: bold;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .cal-day {
            min-height: 60px;
            padding: 4px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cal-day.other-month {
            opacity: 0.3;
            background: #f8fafc;
            pointer-events: none;
        }

        .cal-day.disabled {
            opacity: 0.5;
            background: #f8fafc;
            cursor: not-allowed;
        }

        .cal-day.selected {
            border-color: var(--primary-text);
            box-shadow: 0 0 0 2px rgba(219, 39, 119, 0.2);
            background: #fdf2f8;
        }

        .cal-day .date-num {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .cal-day.sunday .date-num {
            color: #dc2626;
        }

        /* Reservation Indicators */
        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 4px;
        }

        .ind-pending {
            background: #3b82f6;
        }

        /* blue */
        .ind-confirmed {
            background: #22c55e;
        }

        /* green */
    </style>
</head>

<body>
    <?!= include('pages/navigation', {user: user, urlParams: urlParams}); ?>

    <!-- Spinner -->
    <div id="global-spinner" class="container text-center mt-4">
        <div class="spinner"></div>
        <p class="text-muted">読み込み中...</p>
    </div>

    <div class="container hidden" id="main-content">

        <!-- Child Selector -->
        <div class="mb-4">
            <label class="font-bold mb-2 d-block">児童の選択</label>
            <select id="child-selector" onchange="handleChildChange()"></select>
        </div>

        <!-- Quick Status -->
        <div class="card mb-4" id="child-status-card">
            <div class="d-flex justify-between align-center">
                <div>
                    <div class="text-muted">本日のステータス</div>
                    <div class="font-bold mt-2" style="font-size:1.25rem;" id="today-status">-</div>
                </div>
                <div class="text-right">
                    <div class="text-muted">利用料残高</div>
                    <div class="font-bold mt-2" style="font-size:1.25rem; color: #b91c1c;" id="fee-balance">¥0</div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex gap-4 mb-4" style="flex-wrap: wrap;">
            <button class="btn-outline" style="flex:1;" onclick="openAbsenceForm()">
                <div style="font-size:1.5rem; margin-bottom:0.5rem;">🤒</div>
                欠席の連絡
            </button>
            <button class="btn-outline" style="flex:1;" onclick="openReturnMethodForm()">
                <div style="font-size:1.5rem; margin-bottom:0.5rem;">🚌</div>
                帰宅方法の変更
            </button>
        </div>

        <!-- Calendar Section -->
        <div class="card">
            <h2 style="font-size: 1.125rem; margin-top:0;">予約カレンダー</h2>
            <div class="d-flex justify-between align-center mb-4">
                <button class="btn-outline" onclick="changeMonth(-1)">◀ 先月</button>
                <div class="font-bold" id="cal-month-display">2026年3月</div>
                <button class="btn-outline" onclick="changeMonth(1)">翌月 ▶</button>
            </div>

            <div class="calendar" id="calendar">
                <!-- Calendar injected here -->
            </div>

            <!-- Reservation Form (only shown if days selected) -->
            <div id="reservation-form" class="mt-4 hidden"
                style="border-top:1px solid var(--border-color); padding-top:1rem;">
                <h3 style="font-size:1rem;">選択した日の予約 신청</h3>
                <p class="text-muted" id="selected-dates-text"></p>

                <label>利用時間</label>
                <select id="res-time">
                    <option value="14:00-17:00">14:00 - 17:00 (基本)</option>
                    <option value="14:00-18:00">14:00 - 18:00</option>
                    <option value="一日保育">一日保育 (8:00-17:00)</option>
                </select>

                <label>
                    <input type="checkbox" id="res-snack"> おやつを希望する
                </label>

                <button class="btn-primary mt-4" style="width:100%;" onclick="submitReservation()">予約を送信</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast-container"></div>

    <script>
        let currentUser = <?!= JSON.stringify(user) ?>;
        let childrenList = [];
        let activeChildId = null;
        let reservations = [];

        let calDate = new Date();
        let selectedDates = new Set();
        const TODAY_STR = new Date().toISOString().split('T')[0];

        // Polyfill for frontend where Utilities not available
        function toYMD(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        const REAL_TODAY = new Date();
        const REAL_TODAY_STR = toYMD(REAL_TODAY);

        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('fade-out'); setTimeout(() => toast.remove(), 500); }, 3000);
        }

        window.onload = function () {
            document.getElementById('user-greeting').innerText = currentUser.name + ' 様';
            loadChildren(currentUser.email);
        };

        function loadChildren(email) {
            google.script.run
                .withSuccessHandler(function (kids) {
                    childrenList = kids;
                    if (kids.length === 0) {
                        document.getElementById('global-spinner').innerHTML = "紐づく児童が見つかりません。管理者に連絡してください。";
                        return;
                    }

                    const sel = document.getElementById('child-selector');
                    kids.forEach(k => {
                        const opt = document.createElement('option');
                        opt.value = k.id;
                        opt.innerText = k.name + ' (' + k.grade + ')';
                        sel.appendChild(opt);
                    });

                    activeChildId = kids[0].id;
                    document.getElementById('res-snack').checked = kids[0].hasSnack;

                    document.getElementById('global-spinner').classList.add('hidden');
                    document.getElementById('main-content').classList.remove('hidden');

                    fetchChildData();
                })
                .getLinkedChildren(email);
        }

        function handleChildChange() {
            activeChildId = document.getElementById('child-selector').value;
            const kid = childrenList.find(c => c.id === activeChildId);
            if (kid) document.getElementById('res-snack').checked = kid.hasSnack;

            selectedDates.clear();
            document.getElementById('reservation-form').classList.add('hidden');

            fetchChildData();
        }

        function fetchChildData() {
            // Parallel requests in GAS aren't native in JS client aside from multiple calls
            // 1. Get reservations
            google.script.run
                .withSuccessHandler(function (res) {
                    reservations = res;
                    renderCalendar();
                })
                .getReservationsForChild(activeChildId);

            // 2. Get today's attendance status
            google.script.run
                .withSuccessHandler(function (list) {
                    const me = list.find(l => l.childId === activeChildId);
                    if (me) {
                        document.getElementById('today-status').innerText = me.status;
                    }
                })
                .getAttendanceList(REAL_TODAY_STR);

            // 3. Get Billing Balance
            google.script.run
                .withSuccessHandler(function (fin) {
                    document.getElementById('fee-balance').innerText = '¥' + fin.balance.toLocaleString();
                })
                .getChildBalance(activeChildId);
        }

        // --- Calendar Logic ---
        function changeMonth(offset) {
            calDate.setMonth(calDate.getMonth() + offset);
            selectedDates.clear();
            updateReservationForm();
            renderCalendar();
        }

        function renderCalendar() {
            const year = calDate.getFullYear();
            const month = calDate.getMonth();
            document.getElementById('cal-month-display').innerText = `${year}年 ${month + 1}月`;

            const calContainer = document.getElementById('calendar');
            calContainer.innerHTML = '';

            // Headers
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            days.forEach(d => {
                const div = document.createElement('div');
                div.className = 'cal-header';
                div.innerText = d;
                calContainer.appendChild(div);
            });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            // Pad beginning
            for (let i = 0; i < firstDay.getDay(); i++) {
                const div = document.createElement('div');
                div.className = 'cal-day other-month';
                calContainer.appendChild(div);
            }

            // Days
            for (let date = 1; date <= lastDay.getDate(); date++) {
                const dObj = new Date(year, month, date);
                const dateStr = toYMD(dObj);

                const div = document.createElement('div');
                div.className = 'cal-day';
                if (dObj.getDay() === 0) div.classList.add('sunday');

                // Past dates are disabled
                if (dObj < new Date(REAL_TODAY.getFullYear(), REAL_TODAY.getMonth(), REAL_TODAY.getDate())) {
                    div.classList.add('disabled');
                }

                if (selectedDates.has(dateStr)) {
                    div.classList.add('selected');
                }

                // Look for reservation
                const res = reservations.find(r => r.date === dateStr);
                let ind = '';
                if (res) {
                    if (res.status === 'confirmed') ind = '<div class="indicator-dot ind-confirmed" title="確定済"></div>';
                    else if (res.status === 'pending') ind = '<div class="indicator-dot ind-pending" title="申請中"></div>';

                    // if already reserved, disable click
                    div.classList.add('disabled');
                }

                div.innerHTML = `<span class="date-num">${date}</span>${ind}`;

                if (!div.classList.contains('disabled')) {
                    div.onclick = () => toggleDateSelection(dateStr);
                }

                calContainer.appendChild(div);
            }
        }

        function toggleDateSelection(dateStr) {
            if (selectedDates.has(dateStr)) {
                selectedDates.delete(dateStr);
            } else {
                selectedDates.add(dateStr);
            }
            renderCalendar();
            updateReservationForm();
        }

        function updateReservationForm() {
            const form = document.getElementById('reservation-form');
            if (selectedDates.size > 0) {
                form.classList.remove('hidden');
                const datesArr = Array.from(selectedDates).sort();
                document.getElementById('selected-dates-text').innerText = datesArr.map(d => d.split('-').slice(1).join('/')).join(', ');
            } else {
                form.classList.add('hidden');
            }
        }

        function submitReservation() {
            const time = document.getElementById('res-time').value;
            const hasSnack = document.getElementById('res-snack').checked;
            const datesArr = Array.from(selectedDates);

            if (datesArr.length === 0) return;

            showToast('予約を送信しています...');

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        showToast('予約リクエストを送信しました');
                        selectedDates.clear();
                        document.getElementById('reservation-form').classList.add('hidden');
                        fetchChildData(); // reload reservations
                    } else {
                        showToast('エラー: ' + res.error, true);
                    }
                })
                .withFailureHandler(function (e) { showToast('通信エラー', true); })
                .submitReservation(activeChildId, datesArr, time, hasSnack);
        }

        function openAbsenceForm() {
            const reason = prompt("本日の欠席理由を入力してください:");
            if (reason !== null) {
                google.script.run
                    .withSuccessHandler(() => {
                        showToast('欠席・変更を連絡しました');
                        fetchChildData();
                    })
                    .updateAttendance(activeChildId, REAL_TODAY_STR, {
                        status: '欠席',
                        changeRequestType: 'absence',
                        changeRequestValue: reason,
                        changeRequestStatus: 'pending'
                    });
            }
        }

        function openReturnMethodForm() {
            const val = prompt("本日の帰宅方法・時間を入力してください:\n（例：16時にお迎え行きます）");
            if (val !== null && val.trim() !== '') {
                google.script.run
                    .withSuccessHandler(() => {
                        showToast('帰宅変更を連絡しました');
                    })
                    .updateAttendance(activeChildId, REAL_TODAY_STR, {
                        changeRequestType: 'returnMethod',
                        changeRequestValue: val,
                        changeRequestStatus: 'pending'
                    });
            }
        }
    </script>
</body>

</html>
