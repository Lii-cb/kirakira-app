<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>保護者ページ - きらきらマネージャー</title>
    <?!= include('pages/style'); ?>
    <style>
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-text);
            margin: 0 0 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Calendar */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .cal-header {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 0;
        }

        .cal-day {
            min-height: 52px;
            padding: 4px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
            position: relative;
            transition: all 0.15s;
        }

        .cal-day.other-month {
            opacity: 0.25;
            pointer-events: none;
            background: #f8fafc;
        }

        .cal-day.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f9fafb;
        }

        .cal-day.selected {
            border-color: var(--primary-text);
            background: #fdf2f8;
            box-shadow: 0 0 0 2px rgba(219, 39, 119, 0.2);
        }

        .cal-day.has-event {
            background: #fffbeb;
        }

        .cal-day.sunday .date-num {
            color: #dc2626;
        }

        .cal-day.saturday .date-num {
            color: #2563eb;
        }

        .ind {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-top: 2px;
        }

        .ind-pending {
            background: #3b82f6;
        }

        .ind-confirmed {
            background: #22c55e;
        }

        .ind-event {
            background: #f59e0b;
        }

        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.65rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-予定 {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-入室 {
            background: #dcfce7;
            color: #166534;
        }

        .status-退室 {
            background: #f1f5f9;
            color: #475569;
        }

        .status-欠席 {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }

        .modal-box {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>

<body>
    <?!= include('pages/navigation', {user: user, urlParams: urlParams}); ?>

    <div class="container mt-2 mb-4">
        <!-- Child selector -->
        <div class="d-flex align-center gap-4 mb-4" style="flex-wrap:wrap;">
            <label class="font-bold" style="white-space:nowrap; font-size:0.875rem;">対象の児童:</label>
            <select id="child-selector" onchange="handleChildChange()" style="max-width:160px; flex:1;"></select>
        </div>

        <!-- ===== BLOCK 1: 今日のステータス ===== -->
        <div class="card mb-4">
            <h2 class="section-title">🌟 今日のステータス</h2>
            <div id="status-loading" class="text-muted" style="font-size:0.875rem;">読み込み中...</div>
            <div id="status-content" class="hidden">
                <div class="d-flex justify-between align-center mb-3">
                    <div id="today-status-badge"></div>
                    <div class="text-muted" style="font-size:0.75rem;" id="today-date-label"></div>
                </div>
                <div class="d-flex gap-4" style="font-size:0.875rem; margin-bottom:1rem;">
                    <div><span class="text-muted">入室:</span> <strong id="arrival-time">-</strong></div>
                    <div><span class="text-muted">退室:</span> <strong id="departure-time">-</strong></div>
                    <div><span class="text-muted">帰宅:</span> <strong id="return-method">-</strong></div>
                </div>
                <div class="d-flex gap-3" style="flex-wrap:wrap;">
                    <button class="btn-outline" style="flex:1; min-width:120px; font-size:0.8rem;"
                        onclick="openAbsenceModal()">🤒 欠席の連絡</button>
                    <button class="btn-outline" style="flex:1; min-width:120px; font-size:0.8rem;"

                </div>
            </div>
        </div>

        <!-- ===== BLOCK 2: カレンダー ===== -->
        <div class="card mb-4">
            <h2 class="section-title">📅 カレンダー・予約</h2>

            <!-- Month nav -->
            <div class="d-flex justify-between align-center mb-3">
                <button class="btn-outline" onclick="changeMonth(-1)"
                    style="padding:0.2rem 0.7rem; font-size:0.875rem;">◀</button>
                <span class="font-bold" id="cal-month-label"></span>
                <button class="btn-outline" onclick="changeMonth(1)"
                    style="padding:0.2rem 0.7rem; font-size:0.875rem;">▶</button>
            </div>

            <!-- Calendar grid -->
            <div class="calendar" id="calendar"></div>

            <!-- Legend -->
            <div class="d-flex gap-3 mt-2" style="font-size:0.7rem; color:var(--text-muted); flex-wrap:wrap;">
                <span><span
                        style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#3b82f6; margin-right:3px;"></span>申請中</span>
                <span><span
                        style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; margin-right:3px;"></span>承認済</span>
                <span><span
                        style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#f59e0b; margin-right:3px;"></span>おたより</span>
            </div>

            <!-- Reservation form (appears when dates selected) -->
            <div id="reservation-form" class="hidden mt-4"
                style="border-top:1px solid var(--border-color); padding-top:1rem;">
                <div class="font-bold mb-2" style="font-size:0.875rem;">✅ 選択日: <span id="selected-dates-label"
                        style="color:var(--primary-text);"></span></div>
                <select id="res-time" class="mb-3">
                    <option value="15:00-17:00">15:00 - 17:00（通常）</option>
                    <option value="15:00-17:30">15:00 - 17:30</option>
                    <option value="15:00-18:00">15:00 - 18:00</option>
                    <option value="15:00-18:30">15:00 - 18:30</option>
                    <option value="一日保育">一日保育（8:00-17:00）</option>
                </select>
                <label class="d-block mb-2" style="font-size:0.875rem;"><input type="checkbox" id="res-snack"
                        onchange="updateResFee()"> おやつを希望する</label>
                <div id="res-fee" class="text-muted mb-3" style="font-size:0.8rem;"></div>
                <button class="btn-primary" style="width:100%;" onclick="submitReservation()">予約を申し込む</button>
            </div>

            <!-- Reservation history -->
            <div class="mt-4" style="border-top:1px solid var(--border-color); padding-top:1rem;">
                <div class="font-bold mb-2" style="font-size:0.875rem;">申し込み状況</div>
                <div id="reservation-history">
                    <p class="text-muted" style="font-size:0.8rem;">読み込み中...</p>
                </div>
            </div>

            <!-- Documents (notices) -->
            <div class="mt-4" style="border-top:1px solid var(--border-color); padding-top:1rem;">
                <div class="font-bold mb-2" style="font-size:0.875rem;">📄 おたより</div>
                <div id="docs-list">
                    <p class="text-muted" style="font-size:0.8rem;">読み込み中...</p>
                </div>
            </div>
        </div>

        <!-- ===== BLOCK 3: 利用料管理 ===== -->
        <div class="card">
            <h2 class="section-title">💴 利用料管理</h2>
            <div class="d-flex justify-between align-center mb-4">
                <div>
                    <div class="text-muted" style="font-size:0.75rem;">残高</div>
                    <div class="font-bold" style="font-size:1.5rem; color:#b91c1c;" id="pay-balance">¥-</div>
                </div>
                <div class="text-right">
                    <div class="text-muted" style="font-size:0.75rem;">累計請求額</div>
                    <div class="font-bold" id="pay-total">¥-</div>
                </div>
            </div>
            <div style="border-top:1px solid var(--border-color); padding-top:1rem;">
                <div class="font-bold mb-2" style="font-size:0.875rem;">入金報告</div>
                <div class="d-flex gap-3">
                    <input type="number" id="pay-amount" placeholder="金額（円）" style="flex:1;" min="0">
                    <button class="btn-primary" onclick="submitPayment()" style="white-space:nowrap;">送信</button>
                </div>
            </div>
            <div class="mt-4" style="border-top:1px solid var(--border-color); padding-top:1rem;">
                <div class="font-bold mb-2" style="font-size:0.875rem;">入金履歴</div>
                <div id="payment-history">
                    <p class="text-muted" style="font-size:0.8rem;">読み込み中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: 欠席連絡 -->
    <div id="absence-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 style="font-size:1rem; margin-top:0;">🤒 欠席の連絡</h2>
            <p class="text-muted" style="font-size:0.875rem;">本日（<span id="abs-date-label"></span>）の欠席連絡を送信します。</p>
            <textarea id="abs-memo" rows="3" placeholder="理由・メモ（任意）" class="mb-4"></textarea>
            <div class="d-flex gap-3">
                <button class="btn-outline" style="flex:1;" onclick="closeModal('absence-modal')">キャンセル</button>
                <button class="btn-primary" style="flex:1;" onclick="submitAbsence()">送信</button>
            </div>
        </div>
    </div>

    <!-- Modal: 帰宅方法変更 -->
    <div id="return-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 style="font-size:1rem; margin-top:0;">🚌 帰宅方法の変更</h2>
            <p class="text-muted" style="font-size:0.875rem;">本日（<span id="ret-date-label"></span>）の帰宅方法を変更します。</p>
            <div style="display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem;">
                <label><input type="radio" name="return-method" value="お迎え"> 🚗 お迎え</label>
                <label><input type="radio" name="return-method" value="集団下校"> 👥 集団下校</label>
                <label><input type="radio" name="return-method" value="一人帰り"> 🚶 一人帰り</label>
                <label><input type="radio" name="return-method" value="バス"> 🚌 バス</label>
            </div>
            <textarea id="ret-memo" rows="2" placeholder="メモ（任意）" class="mb-4"></textarea>
            <div class="d-flex gap-3">
                <button class="btn-outline" style="flex:1;" onclick="closeModal('return-modal')">キャンセル</button>
                <button class="btn-primary" style="flex:1;" onclick="submitReturnChange()">送信</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const currentUser = <?!= JSON.stringify(user) ?>;
        let childrenList = [];
        let activeChildId = null;
        let calDate = new Date();
        let selectedDates = new Set();
        let reservations = [];
        const TODAY = new Date();
        const TODAY_STR = [TODAY.getFullYear(), String(TODAY.getMonth() + 1).padStart(2, '0'), String(TODAY.getDate()).padStart(2, '0')].join('-');

        function showToast(msg, isError = false) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast' + (isError ? ' error' : '');
            t.innerText = msg;
            c.appendChild(t);
            setTimeout(() => { t.classList.add('fade-out'); setTimeout(() => t.remove(), 500); }, 3000);
        }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function openAbsenceModal() {
            document.getElementById('abs-date-label').innerText = TODAY_STR;
            document.getElementById('absence-modal').classList.remove('hidden');
        }
        function openReturnModal() {
            document.getElementById('ret-date-label').innerText = TODAY_STR;
            document.getElementById('return-modal').classList.remove('hidden');
        }

        // -------- INIT --------
        window.onload = function () {
            google.script.run
                .withSuccessHandler(function (kids) {
                    childrenList = kids || [];
                    const sel = document.getElementById('child-selector');
                    sel.innerHTML = childrenList.map(c => `<option value="${c.id}">${c.name}（${c.grade}年）</option>`).join('');
                    if (childrenList.length > 0) {
                        activeChildId = childrenList[0].id;
                        loadAll();
                    }
                })
                .withFailureHandler(function (e) { showToast('データ取得エラー: ' + e.message, true); })
                .getLinkedChildren(currentUser.email);
        };

        function handleChildChange() {
            activeChildId = document.getElementById('child-selector').value;
            selectedDates.clear();
            loadAll();
        }

        function loadAll() {
            loadStatus();
            loadReservations();
            loadPayment();
        }

        // -------- BLOCK 1: ステータス --------
        function loadStatus() {
            document.getElementById('status-loading').classList.remove('hidden');
            document.getElementById('status-content').classList.add('hidden');
            document.getElementById('today-date-label').innerText = TODAY_STR;
            google.script.run
                .withSuccessHandler(function (rec) {
                    document.getElementById('status-loading').classList.add('hidden');
                    document.getElementById('status-content').classList.remove('hidden');
                    const status = rec ? (rec.status || '未記録') : '未記録';
                    const cls = 'status-' + (status === '未記録' ? '予定' : status);
                    document.getElementById('today-status-badge').innerHTML = `<span class="status-badge ${cls}">${status}</span>`;
                    document.getElementById('arrival-time').innerText = rec && rec.arrivalTime ? rec.arrivalTime : '-';
                    document.getElementById('departure-time').innerText = rec && rec.departureTime ? rec.departureTime : '-';
                    document.getElementById('return-method').innerText = rec && rec.returnMethod ? rec.returnMethod : '-';
                })
                .withFailureHandler(function () {
                    document.getElementById('status-loading').classList.add('hidden');
                    document.getElementById('status-content').classList.remove('hidden');
                })
                .getAttendanceForChild(activeChildId, TODAY_STR);
        }

        function submitAbsence() {
            const memo = document.getElementById('abs-memo').value;
            closeModal('absence-modal');
            google.script.run
                .withSuccessHandler(function (r) {
                    showToast(r.success ? '欠席連絡を送信しました' : 'エラー: ' + r.error, !r.success);
                    if (r.success) loadStatus();
                })
                .withFailureHandler(function (e) { showToast('送信エラー: ' + e.message, true); })
                .submitChangeRequest(activeChildId, TODAY_STR, 'absence', '欠席', memo);
        }

        function submitReturnChange() {
            const m = document.querySelector('input[name="return-method"]:checked');
            if (!m) { showToast('帰宅方法を選択してください', true); return; }
            const memo = document.getElementById('ret-memo').value;
            closeModal('return-modal');
            google.script.run
                .withSuccessHandler(function (r) {
                    showToast(r.success ? '帰宅方法変更を送信しました' : 'エラー: ' + r.error, !r.success);
                    if (r.success) loadStatus();
                })
                .withFailureHandler(function (e) { showToast('送信エラー: ' + e.message, true); })
                .submitChangeRequest(activeChildId, TODAY_STR, 'returnMethod', m.value, memo);
        }

        // -------- BLOCK 2: カレンダー --------
        function loadReservations() {
            google.script.run
                .withSuccessHandler(function (res) {
                    reservations = res || [];
                    renderCalendar();
                    renderReservationHistory();
                })
                .withFailureHandler(function () { renderCalendar(); })
                .getReservationsForChild(activeChildId);

            // Also load documents
            google.script.run
                .withSuccessHandler(renderDocs)
                .withFailureHandler(function () { })
                .getDocuments();
        }

        function changeMonth(delta) {
            calDate.setMonth(calDate.getMonth() + delta);
            selectedDates.clear();
            updateReservationForm();
            renderCalendar();
        }

        function renderCalendar() {
            const y = calDate.getFullYear(), m = calDate.getMonth();
            document.getElementById('cal-month-label').innerText = y + '年' + (m + 1) + '月';
            const cal = document.getElementById('calendar');
            cal.innerHTML = ['日', '月', '火', '水', '木', '金', '土'].map(d => `<div class="cal-header">${d}</div>`).join('');

            const reservedMap = {};
            reservations.forEach(r => { reservedMap[r.date] = r.status; });

            const first = new Date(y, m, 1).getDay();
            const days = new Date(y, m + 1, 0).getDate();

            for (let i = 0; i < first; i++) cal.innerHTML += '<div class="cal-day other-month"></div>';
            for (let d = 1; d <= days; d++) {
                const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                const dow = new Date(y, m, d).getDay();
                const isPast = ds < TODAY_STR;
                const isReserved = !!reservedMap[ds];
                let cls = 'cal-day';
                if (dow === 0) cls += ' sunday';
                if (dow === 6) cls += ' saturday';
                if (dow === 0 || isPast) cls += ' disabled';
                if (selectedDates.has(ds)) cls += ' selected';
                let ind = '';
                if (reservedMap[ds] === 'pending') ind = '<div class="ind ind-pending"></div>';
                else if (reservedMap[ds] === 'confirmed') ind = '<div class="ind ind-confirmed"></div>';
                const clickable = !isPast && dow !== 0 && !isReserved;
                cal.innerHTML += `<div class="${cls}" ${clickable ? `onclick="toggleDate('${ds}')"` : ''}>
                    <span class="date-num">${d}</span>${ind}
                </div>`;
            }
        }

        function toggleDate(ds) {
            if (selectedDates.has(ds)) selectedDates.delete(ds);
            else selectedDates.add(ds);
            renderCalendar();
            updateReservationForm();
        }

        function updateReservationForm() {
            const form = document.getElementById('reservation-form');
            if (selectedDates.size === 0) { form.classList.add('hidden'); return; }
            form.classList.remove('hidden');
            const sorted = Array.from(selectedDates).sort();
            document.getElementById('selected-dates-label').innerText = sorted.join('、') + '（' + sorted.length + '日）';
            updateResFee();
        }

        function updateResFee() {
            const hasSnack = document.getElementById('res-snack').checked;
            const n = selectedDates.size;
            document.getElementById('res-fee').innerText = hasSnack ? `おやつ料（見積）: ¥${100 * n}（¥100 × ${n}日）` : '';
        }

        function submitReservation() {
            if (selectedDates.size === 0) { showToast('日付を選択してください', true); return; }
            const dates = Array.from(selectedDates).sort();
            const time = document.getElementById('res-time').value;
            const hasSnack = document.getElementById('res-snack').checked;
            google.script.run
                .withSuccessHandler(function (r) {
                    showToast(r.success ? `${dates.length}日分の予約を送信しました` : 'エラー: ' + r.error, !r.success);
                    if (r.success) { selectedDates.clear(); updateReservationForm(); loadReservations(); }
                })
                .withFailureHandler(function (e) { showToast('送信エラー: ' + e.message, true); })
                .submitReservation(activeChildId, dates, time, hasSnack);
        }

        function renderReservationHistory() {
            const c = document.getElementById('reservation-history');
            if (!reservations.length) { c.innerHTML = '<p class="text-muted" style="font-size:0.8rem;">予約はありません</p>'; return; }
            const statusLabel = { pending: '申請中', confirmed: '承認済', rejected: '却下', cancelled: '取消' };
            const statusColor = { pending: '#2563eb', confirmed: '#16a34a', rejected: '#dc2626', cancelled: '#9ca3af' };
            c.innerHTML = reservations.slice(0, 15).map(r => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:0.4rem 0; border-bottom:1px solid var(--border-color);">
                    <div>
                        <span class="font-bold" style="font-size:0.875rem;">${r.date}</span>
                        <span class="text-muted" style="font-size:0.75rem; margin-left:6px;">${r.time || ''} ${r.hasSnack ? '🍰' : ''}</span>
                    </div>
                    <div class="d-flex align-center gap-2">
                        <span style="font-size:0.75rem; font-weight:600; color:${statusColor[r.status] || '#6b7280'};">${statusLabel[r.status] || r.status}</span>
                        ${(r.status === 'pending' || r.status === 'confirmed') ? `<button onclick="cancelRes('${r.id}')" style="border:none; background:none; color:#b91c1c; cursor:pointer; font-size:0.7rem; padding:0;">取消</button>` : ''}
                    </div>
                </div>`).join('');
        }

        function cancelRes(id) {
            if (!confirm('この予約を取り消しますか？')) return;
            google.script.run
                .withSuccessHandler(function (r) {
                    showToast(r.success ? '取り消しました' : 'エラー: ' + r.error, !r.success);
                    if (r.success) loadReservations();
                })
                .withFailureHandler(function (e) { showToast('エラー: ' + e.message, true); })
                .cancelReservation(id);
        }

        function renderDocs(docs) {
            const c = document.getElementById('docs-list');
            if (!docs || !docs.length) { c.innerHTML = '<p class="text-muted" style="font-size:0.8rem;">おたよりはありません</p>'; return; }
            const catLabel = { news: 'お知らせ', event: 'イベント', other: 'その他' };
            const catColor = { news: '#0369a1', event: '#b45309', other: '#6b7280' };
            c.innerHTML = docs.slice(0, 10).map(d => `
                <div style="padding:0.4rem 0; border-bottom:1px solid var(--border-color);">
                    <span style="font-size:0.7rem; font-weight:600; color:${catColor[d.category] || '#6b7280'}; background:#f1f5f9; padding:1px 6px; border-radius:4px; margin-right:6px;">${catLabel[d.category] || d.category}</span>
                    <span style="font-size:0.875rem; font-weight:500;">${d.title}</span>
                    ${d.url ? `<br><a href="${d.url}" target="_top" style="font-size:0.75rem; color:var(--primary-text);">🔗 開く</a>` : ''}
                </div>`).join('');
        }

        // -------- BLOCK 3: 利用料 --------
        function loadPayment() {
            google.script.run
                .withSuccessHandler(function (b) {
                    document.getElementById('pay-balance').innerText = '¥' + ((b && b.balance) ? b.balance : 0).toLocaleString();
                    document.getElementById('pay-total').innerText = '¥' + ((b && b.total) ? b.total : 0).toLocaleString();
                })
                .withFailureHandler(function () { })
                .getChildBalance(activeChildId);
            google.script.run
                .withSuccessHandler(function (payments) {
                    const c = document.getElementById('payment-history');
                    if (!payments || !payments.length) { c.innerHTML = '<p class="text-muted" style="font-size:0.8rem;">履歴はありません</p>'; return; }
                    c.innerHTML = payments.map(p => `
                        <div style="display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid var(--border-color);">
                            <div>
                                <span class="font-bold" style="font-size:0.875rem;">¥${(p.amount || 0).toLocaleString()}</span>
                                <span class="text-muted" style="font-size:0.75rem; margin-left:6px;">${p.reportedAt || ''}</span>
                            </div>
                            <span style="font-size:0.75rem; font-weight:600; color:${p.status === 'confirmed' ? '#16a34a' : '#92400e'};">${p.status === 'confirmed' ? '確認済' : '未確認'}</span>
                        </div>`).join('');
                })
                .withFailureHandler(function () { })
                .getPaymentsForChild(activeChildId);
        }

        function submitPayment() {
            const amount = parseInt(document.getElementById('pay-amount').value);
            if (!amount || amount <= 0) { showToast('金額を正しく入力してください', true); return; }
            google.script.run
                .withSuccessHandler(function (r) {
                    showToast(r.success ? '入金報告を送信しました' : 'エラー: ' + r.error, !r.success);
                    if (r.success) { document.getElementById('pay-amount').value = ''; loadPayment(); }
                })
                .withFailureHandler(function (e) { showToast('エラー: ' + e.message, true); })
                .submitPaymentReport(activeChildId, amount);
        }
    </script>
</body>

</html>
