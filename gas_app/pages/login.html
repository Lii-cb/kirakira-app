<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン - きらきらマネージャー</title>
  <?!= include('pages/style'); ?>
  <style>
    body {
      background: linear-gradient(135deg, #fdf2f8 0%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .app-logo {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
    }

    .app-name {
      font-size: 1.75rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    .welcome-text {
      color: #64748b;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .user-pill {
      display: inline-flex;
      align-items: center;
      background: #f1f5f9;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      color: #475569;
    }

    .user-pill::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 8px;
    }

    .login-options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 1rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid transparent;
    }

    .btn-staff {
      background: #1e293b;
      color: white;
      box-shadow: 0 10px 15px -3px rgba(30, 41, 59, 0.3);
    }

    .btn-staff:hover {
      background: #0f172a;
      transform: translateY(-2px);
      box-shadow: 0 20px 25px -5px rgba(30, 41, 59, 0.4);
    }

    .btn-parent {
      background: white;
      color: #db2777;
      border: 2px solid #fbcfe8;
    }

    .btn-parent:hover {
      background: #fdf2f8;
      border-color: #db2777;
      transform: translateY(-2px);
    }

    .error-box {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
      padding: 1.25rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: left;
    }

    .contact-info {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <span class="app-logo">🌟</span>
    <h1 class="app-name">きらきらマネージャー</h1>
    <p class="welcome-text">学童保育・予約管理システム</p>

    <div class="user-pill">
      <?= user.email ?>
    </div>

    <? if (loginError) { ?>
    <div class="error-box">
      <strong>⚠️ アクセス制限</strong><br>
      <?= loginError ?>
    </div>
    <? } ?>

    <? if (user.role === 'unknown') { ?>
    <div class="error-box" style="margin-bottom: 0;">
      <p style="margin:0;">このメールアドレスは登録されていません。<br>
        ご利用には登録が必要です。</p>
      <p style="margin-top:0.75rem; font-weight:700;">児童クラブスタッフにお問合せください。</p>
    </div>
    <? } else { ?>
    <div class="login-options">
      <? var _baseUrl = ScriptApp.getService().getUrl(); ?>
      <a href="<?= _baseUrl ?>?page=admin" class="login-btn btn-staff">
        <span>💼</span> 職員ログイン
      </a>
      <a href="<?= _baseUrl ?>?page=parent" class="login-btn btn-parent">
        <span>🏠</span> 保護者ログイン
      </a>
    </div>
    <? } ?>

    <div class="contact-info">
      &copy; 2026 きらきら児童クラブ
    </div>
  </div>
</body>

</html>
