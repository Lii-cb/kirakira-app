<body>

    <div id="login-form">
      <div id="email-entry-section">
        <div class="input-group" style="margin-bottom: 1.5rem;">
          <label for="login-email"
            style="display:block; text-align:left; font-size:0.85rem; font-weight:700; color:#475569; margin-bottom:0.5rem;">登録メールアドレス</label>
          <input type="email" id="login-email" placeholder="example@gmail.com"

      <div id="user-status-section" class="hidden">
        <div id="user-info-pill" class="user-pill" style="margin-bottom: 1.5rem;">

        </div>

        <!-- PIN Setup Section (First Time Only) -->
        <div id="pin-setup-section" class="hidden">

            <strong>🔓 初回設定</strong><br>

            <input type="password" id="new-pin" placeholder="数字4桁以上"

            <input type="password" id="login-pin" placeholder="****"

  <script>
    let currentEmail = '';

    function verifyEmail() {
      const emailInput = document.getElementById('login-email');
      const email = emailInput.value.trim();
      if (!email || !email.includes('@')) {
        alert('有効なメールアドレスを入力してください。');
        return;
      }

      const btn = document.getElementById('verify-btn');
      btn.disabled = true;
      btn.innerText = '照会中...';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.innerText = '次へ進む';

          if (res.success) {
            currentEmail = email;
            showUserStatus(res.user, res.requiresPin, res.needsPinSetup);
          } else {
            alert('エラー: ' + res.error);
          }
        })
        .withFailureHandler(function (e) {
          btn.disabled = false;
          btn.innerText = '次へ進む';
          alert('システムエラーが発生しました。');
        })
        .checkUserStatus(email);
    }

    function showUserStatus(user, requiresPin, needsPinSetup) {
      document.getElementById('email-entry-section').classList.add('hidden');
      document.getElementById('user-status-section').classList.remove('hidden');
      document.getElementById('user-info-pill').innerText = user.name + ' (' + user.email + ')';

      if (user.role === 'unknown') {
        document.getElementById('unregistered-actions').classList.remove('hidden');
        document.getElementById('registered-actions').classList.add('hidden');
        document.getElementById('pin-entry-section').classList.add('hidden');
        document.getElementById('pin-setup-section').classList.add('hidden');
      } else if (needsPinSetup) {
        document.getElementById('pin-setup-section').classList.remove('hidden');
        document.getElementById('pin-entry-section').classList.add('hidden');
        document.getElementById('registered-actions').classList.add('hidden');
        document.getElementById('unregistered-actions').classList.add('hidden');
      } else if (requiresPin) {
        document.getElementById('pin-entry-section').classList.remove('hidden');
        document.getElementById('pin-setup-section').classList.add('hidden');
        document.getElementById('registered-actions').classList.add('hidden');
        document.getElementById('unregistered-actions').classList.add('hidden');
        document.getElementById('login-pin').focus();
      } else {
        showRegisteredActions(user);
      }
    }

    function setupPin() {
      const pin = document.getElementById('new-pin').value.trim();
      if (pin.length < 4) {
        alert('暗証番号は4桁以上で設定してください。');
        return;
      }

      const btn = document.getElementById('setup-btn');
      btn.disabled = true;
      btn.innerText = '設定中...';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.innerText = '設定を完了してログイン';
          if (res.success) {
            alert('暗証番号を設定しました。');
            // PIN設定成功後、設定したPINで認証を実行
            google.script.run
              .withSuccessHandler(function (verifyRes) {
                if (verifyRes.success && verifyRes.user) {
                  showRegisteredActions(verifyRes.user);
                } else {
                  alert('認証に失敗しました。再度ログインしてください。');
                }
              })
              .verifyUserPin(currentEmail, pin);
          } else {
            alert(res.error);
          }
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.innerText = '設定を完了してログイン';
          alert('設定エラーが発生しました。');
        })
        .updateUserPin(currentEmail, pin);
    }

    function submitPin() {
      const pin = document.getElementById('login-pin').value;
      if (!pin) return;

      const btn = document.getElementById('pin-btn');
      btn.disabled = true;
      btn.innerText = '認証中...';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.innerText = '認証してログイン';
          if (res.success && res.user) {
            // verifyUserPinが直接userを返すので、再呼び出し不要
            showRegisteredActions(res.user);
          } else {
            alert(res.error || '認証に失敗しました。');
            document.getElementById('login-pin').value = '';
          }
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.innerText = '認証してログイン';
          alert('認証エラーが発生しました。');
        })
        .verifyUserPin(currentEmail, pin);
    }

    function showRegisteredActions(user) {
      document.getElementById('pin-entry-section').classList.add('hidden');
      document.getElementById('pin-setup-section').classList.add('hidden');
      document.getElementById('unregistered-actions').classList.add('hidden');
      document.getElementById('registered-actions').classList.remove('hidden');

      const baseUrl = '<?= baseUrl ?>';
      const adminLink = document.getElementById('admin-link');
      const parentLink = document.getElementById('parent-link');

      adminLink.classList.add('hidden');
      parentLink.classList.add('hidden');

      // セキュリティ強化: URLに email= を付けない（キャッシュで管理）
      if (user.role === 'admin' || user.role === 'staff') {
        adminLink.classList.remove('hidden');
        adminLink.href = baseUrl + '?page=admin';
      }
      if (user.role === 'parent' || user.role === 'admin') {
        parentLink.classList.remove('hidden');
        parentLink.href = baseUrl + '?page=parent';
      }
    }

    function resetLoginForm() {
      document.getElementById('user-status-section').classList.add('hidden');
      document.getElementById('registered-actions').classList.add('hidden');
      document.getElementById('unregistered-actions').classList.add('hidden');
      document.getElementById('pin-entry-section').classList.add('hidden');
      document.getElementById('pin-setup-section').classList.add('hidden');
      document.getElementById('admin-link').classList.add('hidden');
      document.getElementById('parent-link').classList.add('hidden');
      document.getElementById('email-entry-section').classList.remove('hidden');
      document.getElementById('login-pin').value = '';
      document.getElementById('new-pin').value = '';
    }

    function requestRegistration() {
      const btn = document.getElementById('request-btn');
      btn.disabled = true;
      btn.innerText = '申請送信中...';

      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            document.getElementById('user-status-section').classList.add('hidden');
            if (res.message) {
              document.getElementById('success-msg-text').innerText = res.message;
            }
            document.getElementById('request-success').classList.remove('hidden');
          } else {
            alert('エラー: ' + res.error);
            btn.disabled = false;
            btn.innerText = '📝 登録を申請する';
          }
        })
        .withFailureHandler(function (e) {
          alert('環境エラーが発生しました。');
          btn.disabled = false;
          btn.innerText = '📝 登録を申請する';
        })
        .sendRegistrationRequest(); // getCurrentUser(forcedEmail) inside handles it if session exists
    }
  </script>
</body>
