<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>金銭管理 - きらきら放課後児童クラブ</title>
    <?!= include('pages/style'); ?>
</head>

<body>
    <?!= include('pages/navigation', {user: user, urlParams: urlParams}); ?>
    <?!= include('pages/utils'); ?>
    <div class="container mt-2">
        <h1 style="font-size:1.25rem; color:var(--primary-text);">💴 金銭管理</h1>

        <div class="card mb-4">
            <h2 style="font-size:1rem; margin-top:0;">承認待ち入金</h2>
            <div id="pending-payments">
                <p class="text-muted">読み込み中...</p>
            </div>
        </div>
        <div class="card">
            <h2 style="font-size:1rem; margin-top:0;">入金履歴</h2>
            <div id="all-payments">
                <p class="text-muted">読み込み中...</p>
            </div>
        </div>
    </div>
    <div id="toast-container"></div>

    <script>
        // showToast is now in utils.html

        window.onload = function () {
            google.script.run
                .withSuccessHandler(renderPayments)
                .withFailureHandler(function (e) { showToast('取得エラー: ' + e.message, true); })
                .getAllPayments();
        };

        function renderPayments(data) {
            const pending = data.filter(p => p.status === 'pending');
            const all = data;

            const pc = document.getElementById('pending-payments');
            if (!pending.length) { pc.innerHTML = '<p class="text-muted">承認待ちはありません ✅</p>'; }
            else {
                pc.innerHTML = `<div style="overflow-x:auto;"><table>
                    <thead><tr><th>児童</th><th>金額</th><th>報告日時</th><th>操作</th></tr></thead>
                    <tbody>${pending.map(p => `<tr>
                        <td>${p.childName || p.childId}</td>
                        <td>¥${(p.amount || 0).toLocaleString()}</td>
                        <td style="font-size:0.8rem;">${p.reportedAt || ''}</td>
                        <td><button onclick="confirm_payment('${p.id}')" style="border:none; background:#dcfce7; color:#166534; padding:4px 10px; border-radius:4px; cursor:pointer;">確認</button></td>
                    </tr>`).join('')}</tbody>
                </table></div>`;
            }

            const ac = document.getElementById('all-payments');
            if (!all.length) { ac.innerHTML = '<p class="text-muted">履歴はありません</p>'; return; }
            ac.innerHTML = `<div style="overflow-x:auto;"><table>
                <thead><tr><th>児童</th><th>金額</th><th>状況</th><th>報告日</th></tr></thead>
                <tbody>${all.map(p => `<tr>
                    <td>${p.childName || p.childId}</td>
                    <td>¥${(p.amount || 0).toLocaleString()}</td>
                    <td><span style="font-size:0.75rem; font-weight:600; color:${p.status === 'confirmed' ? '#166534' : '#92400e'};">${p.status === 'confirmed' ? '確認済' : '未確認'}</span></td>
                    <td style="font-size:0.8rem;">${p.reportedAt || ''}</td>
                </tr>`).join('')}</tbody>
            </table></div>`;
        }

        function confirm_payment(id) {
            google.script.run
                .withSuccessHandler(function (r) {
                    showToast(r.success ? '確認を記録しました' : 'エラー: ' + r.error, !r.success);
                    if (r.success) window.onload();
                })
                .withFailureHandler(function (e) { showToast('エラー: ' + e.message, true); })
                .confirmPayment(id);
        }
    </script>
</body>

</html>
